version: 2026-05-07
status: active-draft
purpose: >
  Canonical registry for editorial categories, ownership rules, default track
  placement, and cross-project migration guidance.

tracks:
  - academy
  - magazine
  - interactive

categories:
  - slug: management
    label: Management
    default_track: academy
    secondary_tracks:
      - magazine
    source_families:
      - study-productivity
    series_families:
      - management-core
      - management-advanced
    notes: Lecture-first domain. Essay support allowed when tied to study or qualification context.

  - slug: economics
    label: Economics
    default_track: academy
    secondary_tracks:
      - interactive
      - magazine
    source_families:
      - study-productivity
      - finance-tax
    series_families:
      - economics-core
      - economics-graphs
    notes: Lecture-first. Simulators and graph islands are allowed when instructional.

  - slug: public-document-writing
    label: Public Document Writing
    default_track: academy
    secondary_tracks:
      - magazine
    source_families:
      - legal-public-admin
    series_families:
      - public-document-core
    notes: Follow 2025 administrative documentation numbering and style rules.

  - slug: ncs
    label: NCS
    default_track: academy
    secondary_tracks:
      - magazine
    source_families:
      - study-productivity
    series_families:
      - ncs-core
      - ncs-strategy
    notes: Includes communication, numeracy, problem solving, self-development, interpersonal, technical skill, organization understanding, and ethics.

  - slug: labor-law
    label: Labor Law
    default_track: academy
    secondary_tracks:
      - magazine
    source_families:
      - legal-public-admin
    series_families:
      - labor-law-basic
      - labor-law-exam
    notes: Qualification-linked. Good bridge domain for public exams and HR lectures.

  - slug: tax-law
    label: Tax Law
    default_track: academy
    secondary_tracks:
      - interactive
      - magazine
    source_families:
      - finance-tax
    series_families:
      - tax-law-basic
      - tax-law-topics
    notes: Covers national tax collection, 종합부동산세, 양도소득세, 상속세, 증여세 and related overview guides.

  - slug: finance-tax
    label: Finance / Tax
    default_track: interactive
    secondary_tracks:
      - academy
      - magazine
    source_families:
      - finance-tax
    series_families:
      - finance-core
      - personal-finance-guides
    notes: Guide plus calculator is often the strongest editorial form.

  - slug: qualifications
    label: Qualification Roadmaps
    default_track: academy
    secondary_tracks:
      - magazine
    source_families:
      - legal-public-admin
      - study-productivity
    series_families:
      - qualification-overviews
    notes: Structured overview pages should connect to actual lecture sequences and data records.

  - slug: study-methods
    label: Study Methods
    default_track: magazine
    secondary_tracks:
      - academy
      - interactive
    source_families:
      - study-productivity
    series_families:
      - study-skills
    notes: Use academy only when it becomes a curriculum. Use interactive only when a concrete exercise or simulator improves the article.

  - slug: psychology-self-discovery
    label: Self-Discovery / Psychology
    default_track: magazine
    secondary_tracks:
      - interactive
    source_families:
      - psychology-self-discovery
    series_families:
      - psychology-essentials
      - self-discovery-guides
    notes: Interpretation first, test second. The essay should still stand on its own.

  - slug: games-puzzles
    label: Games / Puzzles
    default_track: interactive
    secondary_tracks:
      - magazine
    source_families:
      - games-puzzles
      - lostark-game-specific
    series_families:
      - logic-games
      - board-games
    notes: Best used for history, strategy, rules, and embedded playable modules.

  - slug: practical-life
    label: Practical Life
    default_track: magazine
    secondary_tracks:
      - interactive
    source_families:
      - lifestyle-everyday
    series_families:
      - practical-guides
    notes: Housing, tax basics, resumes, travel, health, work, and daily systems belong here unless a calculator becomes central.

  - slug: investing
    label: Investing
    default_track: magazine
    secondary_tracks:
      - interactive
      - academy
    source_families:
      - finance-tax
    series_families:
      - investing-foundations
      - market-frameworks
    notes: Use interactive for valuation, yield, retirement, and DCA tools. Use academy for formal theory sequences.

  - slug: image-dev-utilities
    label: Image / Dev Utilities
    default_track: none
    migration_mode: hold
    secondary_tracks: []
    source_families:
      - image-media-design-dev
    series_families: []
    notes: Cross-link or preserve in source project. Not a priority for blog-oiyo unless a strong editorial angle appears.

rules:
  default_behavior:
    - Prefer explicit track in frontmatter over inferred category mapping.
    - If category and track conflict, review against this registry before publishing.
    - If a category is not listed here, place it in revisit-later before mass expansion.
  hold_behavior:
    - Categories with migration_mode hold are excluded from active migration waves.
    - Hold items may be reconsidered when a clear editorial series or search intent appears.
