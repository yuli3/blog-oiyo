version: 2026-06-20
status: active
purpose: >
  Canonical registry for editorial categories. Expanded (v3) to cover ALL live
  content domains after the WW19 category-normalization passes. Content category
  strings must map to one of these canonical labels. "Magazine" is NOT canonical —
  it is a residual catch-all to be reclassified, not a target.

tracks:
  - academy
  - magazine
  - interactive

# slug is slugifyCategory(label): lowercase, non-alphanumeric -> dash.
categories:

# 2026-09-02: 라벨을 학문명으로 통일한다. 세운이 2026-08-25 에 이미 말했고
# 아래 주석에도 적혀 있는데(“학문명으로 카테고리 만드는 것을 좋아합니다”)
# 정작 정본 라벨 셋이 복합어였다 — `Mind & Psychology`·`Myth & Culture`·
# `Philosophy & Spirit`. 그리고 그 셋을 쓰는 blog 글은 **0편**이었다.
# blog 2,020편이 이미 학문명(`Psychology`·`Mythology`·`Philosophy`)을 쓰고
# 있었으므로, 레지스트리를 현실과 원칙 양쪽에 맞춘다.
  - slug: psychology
    label: Psychology
    default_track: magazine
    notes: Personality, MBTI, attachment, stress, mental health, self-discovery. Interpretation first, test second.

  - slug: mysticism
    label: Mysticism
    default_track: interactive
    notes: Astrology, saju, tarot, zodiac, numerology, dream/fortune. Tools + readings.

  - slug: finance
    label: Finance
    default_track: magazine
    notes: Investing, insurance, banking, personal money. Guide + calculator is often strongest. Accounting and Economics have their own categories.

  - slug: accounting
    label: Accounting
    default_track: academy
    notes: >
      Accounting theory and practice. Certification and qualification prep belongs to Exam.
      Use `subcategory` for the four branches — 회계원리 / 중급회계 / 고급회계 / 원가관리회계
      (Accounting Principles / Intermediate / Advanced / Cost & Management). `series` cannot
      carry them: it drives lecture navigation, and the 16-part course is one series and four branches.

  # 2026-09-02: 181편이 이미 Economics 로 분류돼 있었는데 등록이 없어 drift 로
  # 잡히고 있었다. Finance 의 notes 가 "economics" 를 품고 있었지만, 경제학은
  # 투자·보험·은행과 다른 학문이다 — 사용자 방침("학문명으로 카테고리")에 맞춰
  # 별도 카테고리로 둔다.
  - slug: economics
    label: Economics
    default_track: academy
    notes: Micro/macro theory, market structure, monetary and fiscal policy. Distinct from Finance, which is money you handle.

  - slug: tax
    label: Tax
    default_track: academy
    notes: Income/transfer/inheritance/gift/VAT tax, year-end settlement. Korea-specific; cite official sources.

  - slug: real-estate
    label: Real Estate
    default_track: interactive
    notes: Jeonse/monthly rent, mortgage, property, subscription. Calculator-heavy.

  # 2026-08-25 user directive: "학문명으로 카테고리 만드는 것을 좋아합니다" — law-exam
  # and exam were generic catch-alls, not discipline names. Split into the actual
  # discipline each series belongs to (Law, Business, Real Estate, Accounting,
  # Public Admin, Statistics, Computer Science, Engineering, Economics, Finance,
  # Trade, Social Welfare, Education & Language, or magazine-track Career &
  # Vocation for single-article guides). 359 files reclassified across 6 locales;
  # slugs kept out of this registry so nothing maps back into them.

  - slug: trade
    label: Trade
    default_track: academy
    notes: Customs broker/bonded clerk certification prep, trade English (관세사·보세사·무역영어).

  - slug: social-welfare
    label: Social Welfare
    default_track: academy
    notes: Social worker certification and social welfare law prep (사회복지사·사회복지법제).

  - slug: public-admin
    label: Public Admin
    default_track: academy
    notes: Public administration, public document writing, civil-servant prep.

  - slug: business
    label: Business
    default_track: academy
    notes: Management, HRM, marketing, startup/incorporation, freelancing as a business.

  - slug: career
    label: Career
    default_track: magazine
    notes: Job search, resume, interview, employment, transition/retirement. Cite official labor sources.

  - slug: exam
    label: Exam
    default_track: academy
    notes: Certification and standardized-test preparation, mock exams, eligibility, and exam strategy.

  - slug: computer-science
    label: Computer Science
    default_track: academy
    notes: Programming, AI/ML, data, cloud/security, dev tools. Lecture + practical.

  - slug: engineering
    label: Engineering
    default_track: academy
    notes: Engineering theory and equipment-centered lectures. 기사·산업기사·기능사·기술사 preparation belongs to Exam.

  - slug: education
    label: Education
    default_track: academy
    notes: English, business studies, study methods, language learning, grammar, and school subjects. Standardized tests and certifications belong to Exam.

  - slug: law
    label: Law
    default_track: academy
    notes: Civil, commercial, criminal, constitutional, administrative, labor, and intellectual-property law. Certification-specific strategy belongs to Exam.

  - slug: science-nature
    label: Science & Nature
    default_track: magazine
    notes: Statistics, earth/space science, biology, nature. Lecture or essay.

  - slug: health
    label: Health
    default_track: magazine
    notes: Nutrition, fitness, sleep, body metrics, wellness. YMYL — cite authoritative sources.

  - slug: beauty
    label: Beauty
    default_track: magazine
    notes: Skincare, makeup, fragrance, grooming.

  - slug: lifestyle
    label: Lifestyle
    default_track: magazine
    notes: Everyday life, travel, recipes, hobbies, etiquette, growth/self-improvement, productivity.

  - slug: mythology
    label: Mythology
    default_track: magazine
    notes: Mythology, history, legends, civilizations.

  - slug: humanities
    label: Humanities
    default_track: magazine
    notes: Culture, liberal arts, social science, arts.

  - slug: philosophy
    label: Philosophy
    default_track: magazine
    notes: Philosophy, logic, Buddhism/Taoism, meditation, spirituality.


  - slug: strategy
    label: Strategy
    default_track: magazine
    notes: Strategic thinking, decision frameworks, game theory.


  - slug: sports
    label: Sports
    default_track: magazine
    notes: Sports rules, tactics, participation guides, and esports competition.

  - slug: society-wealth
    label: Society & Wealth
    default_track: magazine
    notes: Society, wealth, inequality, macro-social themes.

  # 2026-09-03: 아래 13개는 이미 콘텐츠가 쓰고 있었는데 등록이 없어 drift 였다.
  # 전부 학문명이라 이름을 바꾸지 않고 그대로 등록한다. 같은 날 이름이 둘인
  # 4쌍을 병합했다 — Natural Science→Science & Nature, Social Science→Humanities,
  # Career & Vocation→Career, Blockchain→Crypto. 한 주제에 이름이 둘이면
  # 중복이 자란다는 것이 세운의 판단이고, 이 파일이 그 재발을 막는다.
  # Design 과 Insights 는 지웠다 — Design 은 사용 0, Insights 는 "한 영역에
  # 들어가지 않는 글" 이라는 형식 기준이라 주제가 아니었다(42편 해체).

  - slug: history
    label: History
    default_track: academy
    notes: World and Korean history, civilizations, historical figures. Mythology has its own category.

  - slug: statistics
    label: Statistics
    default_track: academy
    notes: Descriptive and inferential statistics, probability, data interpretation.

  - slug: music-history
    label: Music History
    default_track: academy
    notes: Composers, periods, works, and the history of Western and Korean music.

  - slug: nursing
    label: Nursing
    default_track: academy
    notes: Nursing theory and licensure preparation. YMYL — cite authoritative sources.

  - slug: art-psychotherapy
    label: Art Psychotherapy
    default_track: academy
    notes: Art therapy theory and practice. A branch of Psychology.

  - slug: zoology
    label: Zoology
    default_track: academy
    notes: Animal behaviour, taxonomy, ecology.

  - slug: actuarial-science
    label: Actuarial Science
    default_track: academy
    notes: Insurance mathematics, risk pricing, actuary preparation.

  - slug: medicine
    label: Medicine
    default_track: academy
    notes: Clinical medicine, disease, treatment. YMYL — cite authoritative sources.

  - slug: technical-analysis
    label: Technical Analysis
    default_track: academy
    notes: Chart patterns, indicators, market timing. Distinct from Finance.

  - slug: product-management
    label: Product Management
    default_track: academy
    notes: Product discovery, roadmap, metrics, PM practice.

  - slug: crypto
    label: Crypto
    default_track: academy
    notes: Cryptocurrency, blockchain, tokens, exchanges. Absorbed the Blockchain label 2026-09-03.

  - slug: photography
    label: Photography
    default_track: academy
    notes: Camera technique, composition, editing.

  - slug: mathematics
    label: Mathematics
    default_track: academy
    notes: Arithmetic through calculus, proofs, mathematical thinking.

rules:
  default_behavior:
    - Prefer explicit track in frontmatter over inferred category mapping.
    - Every published file's category MUST be one of the labels above (validate via npm run content:manifest report).
    - Never use a track name (Academy/Magazine/Interactive) as a category.
  source_authority:
    - Prefer official / primary sources (org address, phone, URL, statute) over secondary material.
    - YMYL categories (tax, health, career, real-estate, law, social-welfare) must cite the official source + URL.
  cleanup_targets:
    - 'Magazine residual catch-all (~178 files) — reclassify into a canonical domain.'
