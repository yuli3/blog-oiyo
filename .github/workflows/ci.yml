name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

# Pushes land in bursts here, and every superseded run used to build all 9,384
# pages to completion. Cloudflare Pages deploys from its own git integration,
# so cancelling a run never cancels a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # 9,391 페이지 빌드 + astro check 874파일이라 정상 런이 이미 10분 안팎이다.
    # 20분은 여유가 2배가 안 됐고, 2026-08-05 느린 러너에서 실제로 20분 20초에 잘렸다
    # (같은 커밋의 로컬 빌드는 350초, 직전 CI 성공 런은 9분 45초 — 코드가 아니라 러너 편차).
    # **타임아웃으로 잘린 초록/빨강은 신호가 아니라 잡음이다** — 콘텐츠가 느는 한 또 걸린다.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate i18n keys
        run: npm run validate:i18n

      - name: Verify harness
        run: npm run verify:harness

      - name: Validate structured data
        run: npm run validate:personality

      - name: Audit markdown emphasis (literal ** leakage)
        run: npm run audit:emphasis

      - name: Audit page structure
        run: npm run audit:page-structure


      - name: Audit translations (locale vs body language)
        # Ratchet against scripts/untranslated-baseline.json — fails on a NEW
        # page that declares a locale but serves Korean, not on the known backlog.
        run: npm run audit:translations

      - name: Type check
        run: npm run type-check

      - name: Build production artifact
        run: npm run build

      # sitemap-submit only reads dist/sitemap*.xml. Handing those over costs a
      # few hundred KB and saves that job a second full 9,384-page build.
      - name: Upload sitemap XML for the submit job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-xml
          path: dist/sitemap*.xml
          retention-days: 1

  sitemap-submit:
    name: Submit Sitemap (GSC + Bing + IndexNow)
    runs-on: ubuntu-latest
    # No build and no hour-long wait any more, so this is now a short job.
    timeout-minutes: 20
    needs: validate
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # IndexNow URL collection reads the sitemap XML from disk rather than
      # HTTP-fetching the live site, which Cloudflare 403s from CI (gotcha #10).
      # Validate already built these, so take them instead of building again.
      - name: Download sitemap XML from validate
        uses: actions/download-artifact@v4
        with:
          name: sitemap-xml
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-api-python-client google-auth

      - name: Wait for Cloudflare Pages deployment
        # Submitting after this exact commit is live is preferable, but waiting
        # up to an hour for it was 59% of the whole Actions bill. Wait five
        # minutes, which covers a normal deploy, then submit regardless: the
        # engines fetch the sitemap URL on their own schedule long after any
        # deploy lands. A slow deploy now shows as a warning, not a failure.
        continue-on-error: true
        run: python scripts/wait-cloudflare-check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_CHECK_TIMEOUT: "300"

      - name: Submit sitemap to all engines
        run: python scripts/sitemap-submit.py
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}

  manifest-check:
    name: Data Manifest Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf-8'));
            const meta = manifest._meta;
            if (!meta || !meta.version || !meta.updated) {
              console.error('manifest.json missing _meta fields');
              process.exit(1);
            }
            const namespaces = Object.keys(manifest.namespaces || {});
            console.log('✓ manifest.json valid —', namespaces.length, 'namespaces, version', meta.version, 'updated', meta.updated);
          "

      - name: Check data files exist
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf-8'));
            let missing = 0;
            for (const [ns, entry] of Object.entries(manifest.namespaces || {})) {
              for (const file of (entry.files || [])) {
                const path = \`public/data/\${ns}/\${file}\`;
                if (!fs.existsSync(path)) {
                  console.error('MISSING:', path);
                  missing++;
                }
              }
            }
            if (missing > 0) {
              console.error(\`\${missing} data file(s) missing — update manifest.json\`);
              process.exit(1);
            }
            console.log('✓ All manifest-referenced data files exist');
          "
