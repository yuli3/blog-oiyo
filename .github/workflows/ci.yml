name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate i18n keys
        run: npm run validate:i18n

      - name: Verify harness
        run: npm run verify:harness

      - name: Validate structured data
        run: npm run validate:personality

      - name: Type check
        run: npm run type-check

  sitemap-submit:
    name: Submit Sitemap (GSC + Bing + IndexNow)
    runs-on: ubuntu-latest
    needs: validate
    # Only run on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv google-api-python-client google-auth

      - name: Wait for Cloudflare Pages deployment
        # Give Cloudflare Pages ~90s to deploy before submitting URLs
        run: sleep 90

      - name: Submit sitemap to all engines
        run: python scripts/sitemap-submit.py
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}

  manifest-check:
    name: Data Manifest Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf-8'));
            const meta = manifest._meta;
            if (!meta || !meta.version || !meta.updated) {
              console.error('manifest.json missing _meta fields');
              process.exit(1);
            }
            const namespaces = Object.keys(manifest.namespaces || {});
            console.log('✓ manifest.json valid —', namespaces.length, 'namespaces, version', meta.version, 'updated', meta.updated);
          "

      - name: Check data files exist
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('public/data/manifest.json', 'utf-8'));
            let missing = 0;
            for (const [ns, entry] of Object.entries(manifest.namespaces || {})) {
              for (const file of (entry.files || [])) {
                const path = \`public/data/\${ns}/\${file}\`;
                if (!fs.existsSync(path)) {
                  console.error('MISSING:', path);
                  missing++;
                }
              }
            }
            if (missing > 0) {
              console.error(\`\${missing} data file(s) missing — update manifest.json\`);
              process.exit(1);
            }
            console.log('✓ All manifest-referenced data files exist');
          "
