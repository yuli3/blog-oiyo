<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Mandatory K-IFRS</title>
  <desc id="desc">This diagram summarises Korea’s Article 6. See the preceding paragraph and official provision for the financial sectors and statutory exceptions. The parent’s consolidated and non-consolidated statements follow the separate rule in paragraph 2. External-audit size criteria are not equivalent to mandatory K-IFRS application.</desc>
  <!-- 2026-10-01: Article 6, not a fictional company's audit-size conclusion; details and exceptions remain in the adjacent text. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <rect x="16" y="313" width="288" height="50" rx="12" fill="#e9eddf"/>
  <path d="M160 288V309M154 303L160 309L166 303M16 384H304M160 464V486M154 480L160 486L166 480" fill="none" stroke="#566842" stroke-width="2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">Mandatory K-IFRS</text>
    <text x="16" y="61" font-size="12">Korean Decree: Article 6 summary</text>
    <text x="16" y="108" font-size="14" font-weight="700">Listed or planning to list</text>
    <text x="16" y="140" font-size="12">Current or following fiscal year</text>
    <text x="16" y="169" font-size="12">KONEX listings and plans excluded</text>
    <text x="16" y="208" font-size="12">OR</text>
    <text x="16" y="249" font-size="14" font-weight="700">Financial entities listed by law</text>
    <text x="16" y="280" font-size="12">See text for sectors and exceptions</text>
    <text x="16" y="343" font-size="14" font-weight="700">Mandatory K-IFRS</text>
    <text x="16" y="419" font-size="12">Parent applies K-IFRS</text>
    <text x="16" y="452" font-size="12">to consolidated statements</text>
    <text x="16" y="511" font-size="12">Also to that parent’s non-consolidated FS</text>
  </g>
</svg>
