<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">K-IFRS强制适用</title>
  <desc id="desc">本图概述韩国施行令第6条的适用路径。金融业务机构的详细列举和法定例外见前文及官方条文。母公司的合并与非合并报表适用第2款的独立规则；外部审计规模条件不等同于K-IFRS强制适用条件。</desc>
  <!-- 2026-10-01: Article 6, not a fictional company's audit-size conclusion; details and exceptions remain in the adjacent text. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <rect x="16" y="313" width="288" height="50" rx="12" fill="#e9eddf"/>
  <path d="M160 288V309M154 303L160 309L166 303M16 384H304M160 464V486M154 480L160 486L166 480" fill="none" stroke="#566842" stroke-width="2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">K-IFRS强制适用</text>
    <text x="16" y="61" font-size="12">韩国施行令第6条概要</text>
    <text x="16" y="108" font-size="14" font-weight="700">已上市或拟上市</text>
    <text x="16" y="140" font-size="12">本年度或下一会计年度</text>
    <text x="16" y="169" font-size="12">排除KONEX上市及拟上市</text>
    <text x="16" y="208" font-size="12">或</text>
    <text x="16" y="249" font-size="14" font-weight="700">法令列举的金融业务机构</text>
    <text x="16" y="280" font-size="12">具体业务与法定例外见正文</text>
    <text x="16" y="343" font-size="14" font-weight="700">K-IFRS强制适用</text>
    <text x="16" y="419" font-size="12">母公司采用K-IFRS</text>
    <text x="16" y="452" font-size="12">在合并财务报表中采用时</text>
    <text x="16" y="511" font-size="12">该母公司的非合并报表也须采用</text>
  </g>
</svg>
