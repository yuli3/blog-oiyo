<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 537" width="480" height="537" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="es">
  <title id="title">Tres tipos de flujos de efectivo</title>
  <desc id="desc">Unidad: 10.000 KRW · Mismo ejemplo del capítulo 1. Operación. Inversión. Financiación. Aumento neto: 100 − 300 + 1.400 = 1.200. Método directo: 200 − 100 = 100. Inicial 0 → Final 1.200. El aumento de efectivo no es la ganancia de 400</desc>
  <rect width="480" height="537" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="125" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="254" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="383" width="448" height="116" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">Tres tipos de flujos de efectivo</text>
    <text x="28" y="74" font-size="21">Unidad: 10.000 KRW · Mismo</text>
    <text x="28" y="104" font-size="21">ejemplo del capítulo 1</text>
    <text x="28" y="150" font-size="24">Operación: +100</text>
    <text x="28" y="183" font-size="24">Inversión: −300</text>
    <text x="28" y="216" font-size="24">Financiación: +1.400</text>
    <text x="28" y="279" font-size="24">Aumento neto: 100 − 300 + 1.400</text>
    <text x="28" y="312" font-size="24">= 1.200</text>
    <text x="28" y="345" font-size="24">Método directo: 200 − 100 = 100</text>
    <text x="28" y="408" font-size="24" font-weight="700">Inicial 0 → Final 1.200</text>
    <text x="28" y="441" font-size="24" font-weight="700">El aumento de efectivo no es la</text>
    <text x="28" y="474" font-size="24" font-weight="700">ganancia de 400</text>
  </g>
</svg>
