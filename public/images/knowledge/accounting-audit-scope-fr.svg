<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Seuils d’une société coréenne</title>
  <desc id="desc">Actif A: 150 ≥ 120. Dettes L: 80 ≥ 70. Chiffre d’affaires S: 90 &lt; 100. Salariés E: 60 &lt; 100. Deux critères sur quatre remplis. Société par actions non cotée · exercice de 12 mois. Aucune exclusion légale supposée</desc>
  <!-- 2026-10-01: Same chapter case; this tests size only, not listing status or statutory exclusions. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="15" font-weight="700">Seuils d’une société coréenne</text>
    <text x="16" y="62" font-size="12">Montants : 100 millions KRW · E : personnes</text>
    <text x="16" y="108" font-size="15" font-weight="700">Actif A</text>
    <text x="16" y="138" font-size="20">150 ≥ 120</text>
    <text x="304" y="138" font-size="14" text-anchor="end">Oui</text>
    <text x="16" y="186" font-size="15" font-weight="700">Dettes L</text>
    <text x="16" y="216" font-size="20">80 ≥ 70</text>
    <text x="304" y="216" font-size="14" text-anchor="end">Oui</text>
    <text x="16" y="264" font-size="15" font-weight="700">Chiffre d’affaires S</text>
    <text x="16" y="294" font-size="20">90 &lt; 100</text>
    <text x="304" y="294" font-size="14" text-anchor="end">Non</text>
    <text x="16" y="342" font-size="15" font-weight="700">Salariés E</text>
    <text x="16" y="372" font-size="20">60 &lt; 100</text>
    <text x="304" y="372" font-size="14" text-anchor="end">Non</text>
    <path d="M16 395H304" stroke="#a7b099"/>
    <text x="16" y="434" font-size="14" font-weight="700">Deux critères sur quatre remplis</text>
    <text x="16" y="486" font-size="13">Société non cotée · exercice de 12 mois</text>
    <text x="16" y="516" font-size="13">Aucune exclusion légale supposée</text>
  </g>
</svg>
