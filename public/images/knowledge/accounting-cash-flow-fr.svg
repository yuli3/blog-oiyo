<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 604" width="480" height="604" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="fr">
  <title id="title">Trois catégories de flux de trésorerie</title>
  <desc id="desc">Unité : 10 000 KRW · Même exemple qu'au chapitre 1. Exploitation. Investissement. Financement. Variation nette : 100 − 300 + 1 400 = 1 200. Méthode directe : 200 − 100 = 100. Ouverture 0 → Clôture 1 200. La hausse de trésorerie n'est pas le résultat de 400</desc>
  <rect width="480" height="604" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="159" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="288" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="450" width="448" height="116" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">Trois catégories de flux de</text>
    <text x="28" y="74" font-size="25" font-weight="700">trésorerie</text>
    <text x="28" y="108" font-size="21">Unité : 10 000 KRW · Même</text>
    <text x="28" y="138" font-size="21">exemple qu'au chapitre 1</text>
    <text x="28" y="184" font-size="24">Exploitation: +100</text>
    <text x="28" y="217" font-size="24">Investissement: −300</text>
    <text x="28" y="250" font-size="24">Financement: +1 400</text>
    <text x="28" y="313" font-size="24">Variation nette : 100 − 300</text>
    <text x="28" y="346" font-size="24">+ 1 400 = 1 200</text>
    <text x="28" y="379" font-size="24">Méthode directe : 200 − 100 =</text>
    <text x="28" y="412" font-size="24">100</text>
    <text x="28" y="475" font-size="24" font-weight="700">Ouverture 0 → Clôture 1 200</text>
    <text x="28" y="508" font-size="24" font-weight="700">La hausse de trésorerie n'est</text>
    <text x="28" y="541" font-size="24" font-weight="700">pas le résultat de 400</text>
  </g>
</svg>
