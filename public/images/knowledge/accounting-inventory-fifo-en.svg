<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">One inventory, three allocations</title>
  <desc id="desc">Allocate KRW 730,000 available for sale between cost of sales and closing inventory: FIFO 470,000/260,000; moving average 474,762/255,238; periodic weighted average 486,667/243,333. Average-cost calculations retain precision until final amounts are rounded to the nearest won. Shrinkage and write-downs are not yet included.</desc>
  <!-- 2026-10-01: Match chapter 8, including opening inventory; bars allocate cost, not sales revenue. -->
  <rect width="320" height="640" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">One inventory, three allocations</text>
    <text x="16" y="61" font-size="15">Unit: KRW</text>
    <text x="16" y="102" font-size="28" font-weight="700">730,000</text>
    <text x="16" y="133" font-size="15">Available 600 · Sold 400 · Closing 200</text>
    <text x="16" y="178" font-size="16" font-weight="700">FIFO</text>
    <text x="16" y="208" font-size="16">Cost of sales 470,000</text>
    <text x="16" y="236" font-size="16">Closing inventory 260,000</text>
    <rect x="16" y="254" width="185.42465753424656" height="24" fill="#566842"/>
    <rect x="201.42465753424656" y="254" width="102.57534246575344" height="24" fill="#c4ceb7"/>
    <text x="16" y="322" font-size="16" font-weight="700">Moving average</text>
    <text x="16" y="352" font-size="16">Cost of sales 474,762</text>
    <text x="16" y="380" font-size="16">Closing inventory 255,238</text>
    <rect x="16" y="398" width="187.30336438356164" height="24" fill="#566842"/>
    <rect x="203.30336438356164" y="398" width="100.69663561643836" height="24" fill="#c4ceb7"/>
    <text x="16" y="466" font-size="16" font-weight="700">Periodic weighted average</text>
    <text x="16" y="496" font-size="16">Cost of sales 486,667</text>
    <text x="16" y="524" font-size="16">Closing inventory 243,333</text>
    <rect x="16" y="542" width="192.00013150684933" height="24" fill="#566842"/>
    <rect x="208.00013150684933" y="542" width="95.99986849315067" height="24" fill="#c4ceb7"/>
    <text x="16" y="590" font-size="15">Each allocation totals 730,000</text>
    <text x="16" y="622" font-size="13">Before shrinkage / write-downs · Rounded KRW</text>
  </g>
</svg>
