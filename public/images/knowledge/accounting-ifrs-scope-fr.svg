<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">K-IFRS obligatoires</title>
  <desc id="desc">Résumé de l’article 6 coréen. Les secteurs financiers et les exceptions légales sont détaillés dans le paragraphe précédent et le texte officiel. Les comptes consolidés et non consolidés de la mère relèvent de la règle distincte du paragraphe 2. Les critères de taille pour l’audit externe ne déterminent pas à eux seuls l’obligation d’appliquer les K-IFRS.</desc>
  <!-- 2026-10-01: Article 6, not a fictional company's audit-size conclusion; details and exceptions remain in the adjacent text. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <rect x="16" y="313" width="288" height="50" rx="12" fill="#e9eddf"/>
  <path d="M160 288V309M154 303L160 309L166 303M16 384H304M160 464V486M154 480L160 486L166 480" fill="none" stroke="#566842" stroke-width="2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">K-IFRS obligatoires</text>
    <text x="16" y="61" font-size="12">Décret coréen : résumé de l’article 6</text>
    <text x="16" y="108" font-size="14" font-weight="700">Cotée ou cotation prévue</text>
    <text x="16" y="140" font-size="12">Exercice actuel ou suivant</text>
    <text x="16" y="169" font-size="12">Cotation et projets KONEX exclus</text>
    <text x="16" y="208" font-size="12">OU</text>
    <text x="16" y="249" font-size="14" font-weight="700">Entités financières visées par la loi</text>
    <text x="16" y="280" font-size="12">Secteurs et exceptions : voir le texte</text>
    <text x="16" y="343" font-size="14" font-weight="700">K-IFRS obligatoires</text>
    <text x="16" y="419" font-size="12">La mère applique les K-IFRS</text>
    <text x="16" y="452" font-size="12">à ses comptes consolidés</text>
    <text x="16" y="511" font-size="12">Aussi à ses comptes non consolidés</text>
  </g>
</svg>
