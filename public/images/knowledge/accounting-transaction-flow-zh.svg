<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 798" width="480" height="798" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="zh">
  <title id="title">营业收入与现金变动的时点不同</title>
  <desc id="desc">单位：万韩元 · 与第1章相同的案例. ④ 提供服务，款项稍后收取. 营业收入 +500 / 应收账款 +500. 现金没有变动. ⑤ 收回部分应收账款. 现金 +200 / 应收账款 −200. 没有新增收入 · 应收账款余额 300. ⑥ 支付本月租金. 费用 +100 / 现金 −100. 利润：500 − 100 = 400. 经营现金流量：200 − 100 = 100</desc>
  <rect width="480" height="798" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="125" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 278v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="287" width="448" height="182" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 473v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="482" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="611" width="448" height="149" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">营业收入与现金变动的时点不同</text>
    <text x="28" y="74" font-size="21">单位：万韩元 · 与第1章相同的</text>
    <text x="28" y="104" font-size="21">案例</text>
    <text x="28" y="150" font-size="24">④ 提供服务，款项稍后收取</text>
    <text x="28" y="183" font-size="24">营业收入 +500 / 应收账款</text>
    <text x="28" y="216" font-size="24">+500</text>
    <text x="28" y="249" font-size="24">现金没有变动</text>
    <text x="28" y="312" font-size="24">⑤ 收回部分应收账款</text>
    <text x="28" y="345" font-size="24">现金 +200 / 应收账款</text>
    <text x="28" y="378" font-size="24">−200</text>
    <text x="28" y="411" font-size="24">没有新增收入 · 应收账款余额</text>
    <text x="28" y="444" font-size="24">300</text>
    <text x="28" y="507" font-size="24">⑥ 支付本月租金</text>
    <text x="28" y="540" font-size="24">费用 +100 / 现金</text>
    <text x="28" y="573" font-size="24">−100</text>
    <text x="28" y="636" font-size="24" font-weight="700">利润：500 − 100 =</text>
    <text x="28" y="669" font-size="24" font-weight="700">400</text>
    <text x="28" y="702" font-size="24" font-weight="700">经营现金流量：200 − 100</text>
    <text x="28" y="735" font-size="24" font-weight="700">= 100</text>
  </g>
</svg>
