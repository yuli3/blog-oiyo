<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" width="320" height="588" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">定額法：初年度の費用と帳簿価額</title>
  <desc id="desc">定額法の初年度：(1,000 − 100) ÷ 5 = 180万ウォン、帳簿価額は1,000 − 180 = 820万ウォン。1月1日から使用可能な状態と仮定する。 減価償却自体は現金の支払ではない。 機械の購入代金の支払と区別する。</desc>
  <!-- 2026-10-01: Match accounting-principles chapter 9; the 18%/82% bar is cost allocation, not market value. -->
  <rect width="320" height="588" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">定額法：初年度の費用と帳簿価額</text>
    <text x="16" y="60" font-size="15">単位：万ウォン（KRW）</text>
    <text x="16" y="99" font-size="16">取得原価</text>
    <text x="16" y="135" font-size="28" font-weight="700">1,000</text>
    <text x="16" y="163" font-size="15">残存価額100・耐用年数5年</text>
    <path d="M160 176v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="230" font-size="16">初年度の減価償却費</text>
    <text x="16" y="263" font-size="21" font-weight="700">(1,000 − 100) ÷ 5 = 180</text>
    <path d="M160 279v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="334" font-size="16">初年度末の帳簿価額</text>
    <text x="16" y="367" font-size="23" font-weight="700">1,000 − 180 = 820</text>
    <text x="16" y="411" font-size="15">原価の配分と残る帳簿価額</text>
    <rect x="16" y="430" width="51.84" height="32" fill="#566842"/>
    <rect x="67.84" y="430" width="236.16" height="32" fill="#c4ceb7"/>
    <text x="16" y="490" font-size="15">償却累計180</text>
    <text x="304" y="490" font-size="15" text-anchor="end">帳簿820</text>
    <text x="16" y="536" font-size="15">減価償却自体は現金の支払ではない。</text>
    <text x="16" y="563" font-size="15">機械の購入代金の支払と区別する。</text>
  </g>
</svg>
