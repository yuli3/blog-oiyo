<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Un pasivo, tres razones de liquidez</title>
  <desc id="desc">Al cierre de 20X2, la razón corriente de FA es 400/200 = 200 %, la prueba ácida (400 − 200)/200 = 100 % y la razón de efectivo 50/200 = 25 %. Excluir inventario reduce el numerador. Las barras comparten escala. Estas cifras no son umbrales sectoriales ni garantías de capacidad de pago futura.</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">Un pasivo, tres razones de liquidez</text>
    <text x="16" y="61" font-size="15">Unidad: %</text>
    <text x="16" y="90" font-size="15">FA ficticia · Fin de 20X2</text>
    <text x="16" y="138" font-size="16" font-weight="700">Razón corriente</text>
    <text x="16" y="172" font-size="21">400 ÷ 200 = 200%</text>
    <rect x="16" y="187" width="288" height="18" fill="#566842"/>
    <text x="16" y="248" font-size="16" font-weight="700">Prueba ácida</text>
    <text x="16" y="282" font-size="21">(400 − 200) ÷ 200 = 100%</text>
    <rect x="16" y="297" width="144" height="18" fill="#566842"/>
    <text x="16" y="358" font-size="16" font-weight="700">Razón de efectivo</text>
    <text x="16" y="392" font-size="21">50 ÷ 200 = 25%</text>
    <rect x="16" y="407" width="36" height="18" fill="#566842"/>
    <text x="16" y="463" font-size="13">Mismo denominador: pasivo corriente final 200</text>
    <text x="16" y="494" font-size="13">No son umbrales ni garantías de pago.</text>
  </g>
</svg>
