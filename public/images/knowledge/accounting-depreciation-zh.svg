<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" width="320" height="588" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">年限平均法：第一年的费用与账面金额</title>
  <desc id="desc">年限平均法第一年：(1,000 − 100) ÷ 5 = 180万韩元，账面金额为1,000 − 180 = 820万韩元。假设机器从1月1日起已达到可使用状态。 折旧本身不是现金支付。 应与支付机器购置款区分。</desc>
  <!-- 2026-10-01: Match accounting-principles chapter 9; the 18%/82% bar is cost allocation, not market value. -->
  <rect width="320" height="588" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">年限平均法：第一年的费用与账面金额</text>
    <text x="16" y="60" font-size="15">单位：万韩元（KRW）</text>
    <text x="16" y="99" font-size="16">取得成本</text>
    <text x="16" y="135" font-size="28" font-weight="700">1,000</text>
    <text x="16" y="163" font-size="15">残值100 · 使用寿命5年</text>
    <path d="M160 176v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="230" font-size="16">第一年折旧额</text>
    <text x="16" y="263" font-size="21" font-weight="700">(1,000 − 100) ÷ 5 = 180</text>
    <path d="M160 279v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="334" font-size="16">第一年末账面金额</text>
    <text x="16" y="367" font-size="23" font-weight="700">1,000 − 180 = 820</text>
    <text x="16" y="411" font-size="15">已分配的成本与剩余账面金额</text>
    <rect x="16" y="430" width="51.84" height="32" fill="#566842"/>
    <rect x="67.84" y="430" width="236.16" height="32" fill="#c4ceb7"/>
    <text x="16" y="490" font-size="15">累计折旧180</text>
    <text x="304" y="490" font-size="15" text-anchor="end">账面820</text>
    <text x="16" y="536" font-size="15">折旧本身不是现金支付。</text>
    <text x="16" y="563" font-size="15">应与支付机器购置款区分。</text>
  </g>
</svg>
