<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" width="320" height="588" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">정액법: 첫해 비용과 장부금액</title>
  <desc id="desc">정액법 첫해: (1,000 − 100) ÷ 5 = 180만 원, 장부금액은 1,000 − 180 = 820만 원이다. 1월 1일부터 사용 가능한 상태라고 가정한다. 감가상각 자체는 현금 지급이 아니다. 기계 구입 대금의 지급과 구분한다.</desc>
  <!-- 2026-10-01: Match accounting-principles chapter 9; the 18%/82% bar is cost allocation, not market value. -->
  <rect width="320" height="588" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">정액법: 첫해 비용과 장부금액</text>
    <text x="16" y="60" font-size="15">단위: 만 원 (KRW)</text>
    <text x="16" y="99" font-size="16">취득원가</text>
    <text x="16" y="135" font-size="28" font-weight="700">1,000</text>
    <text x="16" y="163" font-size="15">잔존가치 100 · 내용연수 5년</text>
    <path d="M160 176v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="230" font-size="16">첫해 감가상각비</text>
    <text x="16" y="263" font-size="21" font-weight="700">(1,000 − 100) ÷ 5 = 180</text>
    <path d="M160 279v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="334" font-size="16">첫해 말 장부금액</text>
    <text x="16" y="367" font-size="23" font-weight="700">1,000 − 180 = 820</text>
    <text x="16" y="411" font-size="15">원가의 배분과 남은 장부금액</text>
    <rect x="16" y="430" width="51.84" height="32" fill="#566842"/>
    <rect x="67.84" y="430" width="236.16" height="32" fill="#c4ceb7"/>
    <text x="16" y="490" font-size="15">누계 180</text>
    <text x="304" y="490" font-size="15" text-anchor="end">장부 820</text>
    <text x="16" y="536" font-size="15">감가상각 자체는 현금 지급이 아니다.</text>
    <text x="16" y="563" font-size="15">기계 구입 대금의 지급과 구분한다.</text>
  </g>
</svg>
