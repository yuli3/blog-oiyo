<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="title desc">
  <title id="title">장비 300만 원에서 1년 감가 60만 원을 빼면 장부 240</title>
  <desc id="desc">취득원가 300만 원. 정액법으로 1년에 60만 원을 배분하면 감가상각누계 60만 원, 장부금액 240만 원입니다. 장비를 산 현금 300만 원은 1장에서 이미 나갔습니다.</desc>
  <rect width="640" height="480" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">장비 300만 원의 정액법 1년</text>
    <text x="32" y="80" font-size="19">내용연수 5년 · 잔존가치 0 · 단위: 만 원</text>
    <rect x="24" y="108" width="592" height="80" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="158" font-size="22" font-weight="700">취득원가 300 · 1장에서 현금으로 지급</text>
    <path d="M320 194v22m-8-8 8 8 8-8" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="224" width="592" height="80" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="274" font-size="22" font-weight="700">연간 비용 (300 − 0) ÷ 5 = 60</text>
    <path d="M320 310v22m-8-8 8 8 8-8" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="340" width="592" height="112" rx="12" fill="#e9eddf"/>
    <text x="44" y="384" font-size="23" font-weight="700">1년 후 장부금액 240</text>
    <text x="44" y="420" font-size="20">누계 60 · 추가 현금 유출 없음</text>
  </g>
</svg>
