<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 692" width="320" height="692" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Du chiffre d’affaires au résultat net</title>
  <desc id="desc">Compte de résultat du fabricant par fonction : chiffre d’affaires 10 000 − coût des ventes 5 200 = marge brute 4 800 ; les frais commerciaux et administratifs de 2 100 laissent un résultat opérationnel de 2 700. Après intérêts de 200 et impôt de 500, le résultat net est de 2 000 (unité : 10 000 KRW). Les stocks de produits finis ne varient pas. Les barres des sous-totaux ont la même base de chiffre d’affaires. Le résultat n’est pas le flux de trésorerie.</desc>
  <!-- 2026-10-01: Chapter 6 manufacturer, not the old chapter 1 service example; all subtotal bars share the revenue scale. -->
  <rect width="320" height="692" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">Du chiffre d’affaires au résultat net</text>
    <text x="16" y="61" font-size="15">Unité : 10 000 KRW</text>
    <text x="16" y="98" font-size="15">Chiffre d’affaires</text>
    <text x="16" y="123" font-size="21" font-weight="700">10 000</text>
    <rect x="120" y="108" width="184" height="14" fill="#566842"/>
    <text x="16" y="158" font-size="15">Coût des ventes</text>
    <text x="16" y="183" font-size="21" font-weight="400">−5 200</text>
    <text x="16" y="218" font-size="15">Marge brute</text>
    <text x="16" y="243" font-size="21" font-weight="700">4 800</text>
    <rect x="120" y="228" width="88.32" height="14" fill="#566842"/>
    <text x="16" y="278" font-size="15">Frais commerciaux et administratifs</text>
    <text x="16" y="303" font-size="21" font-weight="400">−2 100</text>
    <text x="16" y="338" font-size="15">Résultat opérationnel</text>
    <text x="16" y="363" font-size="21" font-weight="700">2 700</text>
    <rect x="120" y="348" width="49.68" height="14" fill="#566842"/>
    <text x="16" y="398" font-size="15">Charge d’intérêts</text>
    <text x="16" y="423" font-size="21" font-weight="400">−200</text>
    <text x="16" y="458" font-size="15">Résultat avant impôt</text>
    <text x="16" y="483" font-size="21" font-weight="700">2 500</text>
    <rect x="120" y="468" width="46" height="14" fill="#566842"/>
    <text x="16" y="518" font-size="15">Impôt sur le résultat</text>
    <text x="16" y="543" font-size="21" font-weight="400">−500</text>
    <text x="16" y="578" font-size="15">Résultat net</text>
    <text x="16" y="603" font-size="21" font-weight="700">2 000</text>
    <rect x="120" y="588" width="36.8" height="14" fill="#566842"/>
    <text x="16" y="641" font-size="13">Barres des sous-totaux : base commune 10 000</text>
    <text x="16" y="674" font-size="15">Le résultat n’est pas le flux de trésorerie.</text>
  </g>
</svg>
