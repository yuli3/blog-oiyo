<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Korean stock-company thresholds</title>
  <desc id="desc">Assets A: 150 ≥ 120. Liabilities L: 80 ≥ 70. Revenue S: 90 &lt; 100. Employees E: 60 &lt; 100. Two of four criteria met. Unlisted stock company · 12-month year. Assume no statutory exclusion</desc>
  <!-- 2026-10-01: Same chapter case; this tests size only, not listing status or statutory exclusions. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="15" font-weight="700">Korean stock-company thresholds</text>
    <text x="16" y="62" font-size="12">Money: KRW 100 million · E: people</text>
    <text x="16" y="108" font-size="15" font-weight="700">Assets A</text>
    <text x="16" y="138" font-size="20">150 ≥ 120</text>
    <text x="304" y="138" font-size="14" text-anchor="end">Met</text>
    <text x="16" y="186" font-size="15" font-weight="700">Liabilities L</text>
    <text x="16" y="216" font-size="20">80 ≥ 70</text>
    <text x="304" y="216" font-size="14" text-anchor="end">Met</text>
    <text x="16" y="264" font-size="15" font-weight="700">Revenue S</text>
    <text x="16" y="294" font-size="20">90 &lt; 100</text>
    <text x="304" y="294" font-size="14" text-anchor="end">Not met</text>
    <text x="16" y="342" font-size="15" font-weight="700">Employees E</text>
    <text x="16" y="372" font-size="20">60 &lt; 100</text>
    <text x="304" y="372" font-size="14" text-anchor="end">Not met</text>
    <path d="M16 395H304" stroke="#a7b099"/>
    <text x="16" y="434" font-size="14" font-weight="700">Two of four criteria met</text>
    <text x="16" y="486" font-size="13">Unlisted stock company · 12-month year</text>
    <text x="16" y="516" font-size="13">No statutory exclusion assumed</text>
  </g>
</svg>
