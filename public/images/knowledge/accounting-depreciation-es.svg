<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" width="320" height="588" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Depreciación lineal: año 1</title>
  <desc id="desc">Primer año por el método lineal: (1.000 − 100) ÷ 5 = 180; importe en libros: 1.000 − 180 = 820 (unidad: 10.000 KRW). Se supone que la máquina está disponible para su uso desde el 1 de enero. Depreciar no es efectuar un pago. Se distingue del pago por la máquina.</desc>
  <!-- 2026-10-01: Match accounting-principles chapter 9; the 18%/82% bar is cost allocation, not market value. -->
  <rect width="320" height="588" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">Depreciación lineal: año 1</text>
    <text x="16" y="60" font-size="15">Unidad: 10.000 KRW</text>
    <text x="16" y="99" font-size="16">Costo de adquisición</text>
    <text x="16" y="135" font-size="28" font-weight="700">1.000</text>
    <text x="16" y="163" font-size="15">Valor residual 100 · Vida útil 5 años</text>
    <path d="M160 176v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="230" font-size="16">Depreciación del primer año</text>
    <text x="16" y="263" font-size="21" font-weight="700">(1.000 − 100) ÷ 5 = 180</text>
    <path d="M160 279v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="334" font-size="16">Importe en libros al cierre</text>
    <text x="16" y="367" font-size="23" font-weight="700">1.000 − 180 = 820</text>
    <text x="16" y="411" font-size="15">Costo asignado e importe en libros</text>
    <rect x="16" y="430" width="51.84" height="32" fill="#566842"/>
    <rect x="67.84" y="430" width="236.16" height="32" fill="#c4ceb7"/>
    <text x="16" y="490" font-size="15">Acumulada 180</text>
    <text x="304" y="490" font-size="15" text-anchor="end">En libros 820</text>
    <text x="16" y="536" font-size="15">Depreciar no es efectuar un pago.</text>
    <text x="16" y="563" font-size="15">Se distingue del pago por la máquina.</text>
  </g>
</svg>
