<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 537" width="480" height="537" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="zh">
  <title id="title">现金流量的三个类别</title>
  <desc id="desc">单位：万韩元 · 与第1章相同的案例. 经营活动. 投资活动. 筹资活动. 净增加：100 − 300 + 1,400 = 1,200. 直接法经营现金：200 − 100 = 100. 期初 0 → 期末 1,200. 现金增加与利润400不是同一指标</desc>
  <rect width="480" height="537" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="125" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="254" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="416" width="448" height="83" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">现金流量的三个类别</text>
    <text x="28" y="74" font-size="21">单位：万韩元 · 与第1章相同的</text>
    <text x="28" y="104" font-size="21">案例</text>
    <text x="28" y="150" font-size="24">经营活动: +100</text>
    <text x="28" y="183" font-size="24">投资活动: −300</text>
    <text x="28" y="216" font-size="24">筹资活动: +1,400</text>
    <text x="28" y="279" font-size="24">净增加：100 − 300</text>
    <text x="28" y="312" font-size="24">+ 1,400 = 1,200</text>
    <text x="28" y="345" font-size="24">直接法经营现金：200</text>
    <text x="28" y="378" font-size="24">− 100 = 100</text>
    <text x="28" y="441" font-size="24" font-weight="700">期初 0 → 期末 1,200</text>
    <text x="28" y="474" font-size="24" font-weight="700">现金增加与利润400不是同一指标</text>
  </g>
</svg>
