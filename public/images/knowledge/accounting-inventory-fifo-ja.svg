<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">同じ棚卸資産、三つの原価配分</title>
  <desc id="desc">販売可能な棚卸資産730,000ウォンを売上原価と期末棚卸高に配分する。先入先出法470,000/260,000、移動平均法474,762/255,238、総平均法486,667/243,333ウォン。平均法では計算途中の精度を保ち、最終金額をウォン単位で四捨五入する。棚卸減耗・評価損は未反映。</desc>
  <!-- 2026-10-01: Match chapter 8, including opening inventory; bars allocate cost, not sales revenue. -->
  <rect width="320" height="640" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">同じ棚卸資産、三つの原価配分</text>
    <text x="16" y="61" font-size="15">単位：ウォン（KRW）</text>
    <text x="16" y="102" font-size="28" font-weight="700">730,000</text>
    <text x="16" y="133" font-size="15">販売可能600個・販売400・期末200</text>
    <text x="16" y="178" font-size="16" font-weight="700">先入先出法</text>
    <text x="16" y="208" font-size="16">売上原価 470,000</text>
    <text x="16" y="236" font-size="16">期末棚卸高 260,000</text>
    <rect x="16" y="254" width="185.42465753424656" height="24" fill="#566842"/>
    <rect x="201.42465753424656" y="254" width="102.57534246575344" height="24" fill="#c4ceb7"/>
    <text x="16" y="322" font-size="16" font-weight="700">移動平均法</text>
    <text x="16" y="352" font-size="16">売上原価 474,762</text>
    <text x="16" y="380" font-size="16">期末棚卸高 255,238</text>
    <rect x="16" y="398" width="187.30336438356164" height="24" fill="#566842"/>
    <rect x="203.30336438356164" y="398" width="100.69663561643836" height="24" fill="#c4ceb7"/>
    <text x="16" y="466" font-size="16" font-weight="700">総平均法</text>
    <text x="16" y="496" font-size="16">売上原価 486,667</text>
    <text x="16" y="524" font-size="16">期末棚卸高 243,333</text>
    <rect x="16" y="542" width="192.00013150684933" height="24" fill="#566842"/>
    <rect x="208.00013150684933" y="542" width="95.99986849315067" height="24" fill="#c4ceb7"/>
    <text x="16" y="590" font-size="15">各方法の配分合計：730,000</text>
    <text x="16" y="622" font-size="13">棚卸減耗・評価損の反映前・ウォン単位四捨五入</text>
  </g>
</svg>
