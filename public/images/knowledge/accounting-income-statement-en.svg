<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 692" width="320" height="692" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">From revenue to net profit</title>
  <desc id="desc">The manufacturer’s statement by function: revenue 10,000 − cost of sales 5,200 = gross profit 4,800; selling and administrative costs of 2,100 leave operating profit 2,700. Interest of 200 and tax of 500 leave net profit 2,000 (unit: KRW 10,000). Opening and closing finished-goods inventories do not differ. Subtotal bars use the same revenue baseline. Profit is not cash flow.</desc>
  <!-- 2026-10-01: Chapter 6 manufacturer, not the old chapter 1 service example; all subtotal bars share the revenue scale. -->
  <rect width="320" height="692" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">From revenue to net profit</text>
    <text x="16" y="61" font-size="15">Unit: KRW 10,000</text>
    <text x="16" y="98" font-size="15">Revenue</text>
    <text x="16" y="123" font-size="21" font-weight="700">10,000</text>
    <rect x="120" y="108" width="184" height="14" fill="#566842"/>
    <text x="16" y="158" font-size="15">Cost of sales</text>
    <text x="16" y="183" font-size="21" font-weight="400">−5,200</text>
    <text x="16" y="218" font-size="15">Gross profit</text>
    <text x="16" y="243" font-size="21" font-weight="700">4,800</text>
    <rect x="120" y="228" width="88.32" height="14" fill="#566842"/>
    <text x="16" y="278" font-size="15">Selling and administrative costs</text>
    <text x="16" y="303" font-size="21" font-weight="400">−2,100</text>
    <text x="16" y="338" font-size="15">Operating profit</text>
    <text x="16" y="363" font-size="21" font-weight="700">2,700</text>
    <rect x="120" y="348" width="49.68" height="14" fill="#566842"/>
    <text x="16" y="398" font-size="15">Interest expense</text>
    <text x="16" y="423" font-size="21" font-weight="400">−200</text>
    <text x="16" y="458" font-size="15">Profit before tax</text>
    <text x="16" y="483" font-size="21" font-weight="700">2,500</text>
    <rect x="120" y="468" width="46" height="14" fill="#566842"/>
    <text x="16" y="518" font-size="15">Income tax expense</text>
    <text x="16" y="543" font-size="21" font-weight="400">−500</text>
    <text x="16" y="578" font-size="15">Net profit</text>
    <text x="16" y="603" font-size="21" font-weight="700">2,000</text>
    <rect x="120" y="588" width="36.8" height="14" fill="#566842"/>
    <text x="16" y="641" font-size="13">Subtotal bars: one revenue baseline, 10,000</text>
    <text x="16" y="674" font-size="15">Profit is not cash flow.</text>
  </g>
</svg>
