<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">K-IFRS 의무적용</title>
  <desc id="desc">도식은 한국 시행령 제6조의 적용 경로를 요약한 것이다. 금융업종의 상세 열거와 법정 예외는 앞 문단 및 공식 조문을 확인한다. 지배회사의 연결·비연결 적용은 제2항의 별도 규칙이며, 외부감사 규모 요건이 K-IFRS 의무와 같은 것은 아니다.</desc>
  <!-- 2026-10-01: Article 6, not a fictional company's audit-size conclusion; details and exceptions remain in the adjacent text. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <rect x="16" y="313" width="288" height="50" rx="12" fill="#e9eddf"/>
  <path d="M160 288V309M154 303L160 309L166 303M16 384H304M160 464V486M154 480L160 486L166 480" fill="none" stroke="#566842" stroke-width="2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">K-IFRS 의무적용</text>
    <text x="16" y="61" font-size="12">한국 시행령 제6조 요약</text>
    <text x="16" y="108" font-size="14" font-weight="700">상장 또는 상장예정</text>
    <text x="16" y="140" font-size="12">당기 또는 다음 사업연도</text>
    <text x="16" y="169" font-size="12">코넥스 상장·상장예정은 제외</text>
    <text x="16" y="208" font-size="12">또는</text>
    <text x="16" y="249" font-size="14" font-weight="700">법령에 열거된 금융업종</text>
    <text x="16" y="280" font-size="12">업종과 법정 예외는 본문 참조</text>
    <text x="16" y="343" font-size="14" font-weight="700">K-IFRS 의무적용</text>
    <text x="16" y="419" font-size="12">지배회사가 K-IFRS 적용</text>
    <text x="16" y="452" font-size="12">연결재무제표에 적용하면</text>
    <text x="16" y="511" font-size="12">그 지배회사의 비연결에도 적용</text>
  </g>
</svg>
