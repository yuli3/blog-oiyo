<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">K-IFRS 의무는 상장·금융 등이고 학습용 회사는 해당 없다</title>
  <desc id="desc">시행령 제6조의 K-IFRS 의무는 주권상장법인 등입니다. 학습용 회사는 상장도 외감 대상도 아니므로 그 대상이 아닙니다. 채택 공시가 아닙니다.</desc>
  <rect width="640" height="400" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">K-IFRS 의무와 이 장부</text>
    <text x="32" y="80" font-size="19">확인일 2026-09-01 · 채택 공시 아님</text>
    <rect x="24" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="152" font-size="20">시행령 제6조 예</text>
    <text x="44" y="200" font-size="24" font-weight="700">주권상장법인 등</text>
    <text x="44" y="236" font-size="18">코넥스 제외 · 전 호 아님</text>
    <rect x="332" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="352" y="152" font-size="20">학습용 회사</text>
    <text x="352" y="200" font-size="24" font-weight="700">상장 아님 · 외감 아님</text>
    <text x="352" y="236" font-size="18">자산 1,800만 원</text>
    <rect x="24" y="288" width="592" height="84" rx="12" fill="#e9eddf"/>
    <text x="44" y="324" font-size="22" font-weight="700">연결·리스·공정가치 숫자를 만들지 않음</text>
    <text x="44" y="356" font-size="20">1~7장은 공개 개념을 읽었을 뿐</text>
  </g>
</svg>
