<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 692" width="320" height="692" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">De los ingresos al resultado neto</title>
  <desc id="desc">Estado de resultados del fabricante por función: ingresos 10.000 − costo de ventas 5.200 = ganancia bruta 4.800; tras gastos de venta y administración de 2.100, el resultado operativo es 2.700. Restando intereses de 200 e impuestos de 500, el resultado del periodo es 2.000 (unidad: 10.000 KRW). No varían las existencias de productos terminados. Las barras de subtotales usan la misma base de ingresos. El resultado no es el flujo de efectivo.</desc>
  <!-- 2026-10-01: Chapter 6 manufacturer, not the old chapter 1 service example; all subtotal bars share the revenue scale. -->
  <rect width="320" height="692" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">De los ingresos al resultado neto</text>
    <text x="16" y="61" font-size="15">Unidad: 10.000 KRW</text>
    <text x="16" y="98" font-size="15">Ingresos</text>
    <text x="16" y="123" font-size="21" font-weight="700">10.000</text>
    <rect x="120" y="108" width="184" height="14" fill="#566842"/>
    <text x="16" y="158" font-size="15">Costo de ventas</text>
    <text x="16" y="183" font-size="21" font-weight="400">−5.200</text>
    <text x="16" y="218" font-size="15">Ganancia bruta</text>
    <text x="16" y="243" font-size="21" font-weight="700">4.800</text>
    <rect x="120" y="228" width="88.32" height="14" fill="#566842"/>
    <text x="16" y="278" font-size="15">Gastos de venta y administración</text>
    <text x="16" y="303" font-size="21" font-weight="400">−2.100</text>
    <text x="16" y="338" font-size="15">Resultado operativo</text>
    <text x="16" y="363" font-size="21" font-weight="700">2.700</text>
    <rect x="120" y="348" width="49.68" height="14" fill="#566842"/>
    <text x="16" y="398" font-size="15">Gasto por intereses</text>
    <text x="16" y="423" font-size="21" font-weight="400">−200</text>
    <text x="16" y="458" font-size="15">Resultado antes de impuestos</text>
    <text x="16" y="483" font-size="21" font-weight="700">2.500</text>
    <rect x="120" y="468" width="46" height="14" fill="#566842"/>
    <text x="16" y="518" font-size="15">Impuesto a las ganancias</text>
    <text x="16" y="543" font-size="21" font-weight="400">−500</text>
    <text x="16" y="578" font-size="15">Resultado del periodo</text>
    <text x="16" y="603" font-size="21" font-weight="700">2.000</text>
    <rect x="120" y="588" width="36.8" height="14" fill="#566842"/>
    <text x="16" y="641" font-size="13">Barras de subtotales: misma base de 10.000</text>
    <text x="16" y="674" font-size="15">El resultado no es el flujo de efectivo.</text>
  </g>
</svg>
