<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="title desc">
  <title id="title">영업 100, 투자 −300, 재무 1,400이 기말 현금 1,200</title>
  <desc id="desc">영업활동 현금 +100만 원, 투자활동 −300만 원, 재무활동 +1,400만 원을 더하면 순증가 1,200만 원입니다. 기초 현금 0에서 기말 현금 1,200만 원이 됩니다.</desc>
  <rect width="640" height="520" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">한 달 현금의 세 갈래</text>
    <text x="32" y="80" font-size="19">1장과 같은 회사 · 단위: 만 원</text>
    <rect x="24" y="108" width="184" height="120" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="152" font-size="20">영업</text>
    <text x="44" y="196" font-size="28" font-weight="700">+100</text>
    <rect x="228" y="108" width="184" height="120" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="248" y="152" font-size="20">투자</text>
    <text x="248" y="196" font-size="28" font-weight="700">−300</text>
    <rect x="432" y="108" width="184" height="120" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="452" y="152" font-size="20">재무</text>
    <text x="452" y="196" font-size="28" font-weight="700">+1,400</text>
    <path d="M320 236v28m-8-8 8 8 8-8" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="276" width="592" height="88" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="320" font-size="22" font-weight="700">순증가 100 − 300 + 1,400 = 1,200</text>
    <text x="44" y="352" font-size="20">직접법 영업현금 200 − 100 = 100</text>
    <rect x="24" y="384" width="592" height="108" rx="12" fill="#e9eddf"/>
    <text x="44" y="428" font-size="23" font-weight="700">기초 0 → 기말 1,200</text>
    <text x="44" y="464" font-size="20">이익 400과 다른 질문의 답</text>
  </g>
</svg>
