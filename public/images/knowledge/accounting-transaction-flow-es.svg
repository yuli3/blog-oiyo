<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 766" width="480" height="766" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="es">
  <title id="title">Ingresos y efectivo: momentos distintos</title>
  <desc id="desc">Unidad: 10.000 KRW · Mismo ejemplo del capítulo 1. ④ Prestación de servicios a crédito. Ingresos +500 / Cuentas por cobrar +500. Sin movimiento de efectivo. ⑤ Cobro parcial de la cuenta. Efectivo +200 / Cuentas por cobrar −200. Sin nuevos ingresos · Saldo por cobrar: 300. ⑥ Pago del alquiler del mes. Gasto +100 / Efectivo −100. Ganancia: 500 − 100 = 400. Flujo operativo: 200 − 100 = 100</desc>
  <rect width="480" height="766" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="159" width="448" height="182" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 345v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="354" width="448" height="182" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 540v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="549" width="448" height="83" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="645" width="448" height="83" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">Ingresos y efectivo: momentos</text>
    <text x="28" y="74" font-size="25" font-weight="700">distintos</text>
    <text x="28" y="108" font-size="21">Unidad: 10.000 KRW · Mismo</text>
    <text x="28" y="138" font-size="21">ejemplo del capítulo 1</text>
    <text x="28" y="184" font-size="24">④ Prestación de servicios a</text>
    <text x="28" y="217" font-size="24">crédito</text>
    <text x="28" y="250" font-size="24">Ingresos +500 / Cuentas por</text>
    <text x="28" y="283" font-size="24">cobrar +500</text>
    <text x="28" y="316" font-size="24">Sin movimiento de efectivo</text>
    <text x="28" y="379" font-size="24">⑤ Cobro parcial de la cuenta</text>
    <text x="28" y="412" font-size="24">Efectivo +200 / Cuentas por</text>
    <text x="28" y="445" font-size="24">cobrar −200</text>
    <text x="28" y="478" font-size="24">Sin nuevos ingresos · Saldo por</text>
    <text x="28" y="511" font-size="24">cobrar: 300</text>
    <text x="28" y="574" font-size="24">⑥ Pago del alquiler del mes</text>
    <text x="28" y="607" font-size="24">Gasto +100 / Efectivo −100</text>
    <text x="28" y="670" font-size="24" font-weight="700">Ganancia: 500 − 100 = 400</text>
    <text x="28" y="703" font-size="24" font-weight="700">Flujo operativo: 200 − 100 = 100</text>
