<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">One liability base, three ratios</title>
  <desc id="desc">FA’s closing 20X2 current ratio is 400/200 = 200%; its quick ratio is (400 − 200)/200 = 100%; its cash ratio is 50/200 = 25%. Excluding inventory reduces the numerator. Bars share one ratio scale. These figures are neither industry pass marks nor guarantees of future payment capacity.</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">One liability base, three ratios</text>
    <text x="16" y="61" font-size="15">Unit: %</text>
    <text x="16" y="90" font-size="15">Fictional FA · End of 20X2</text>
    <text x="16" y="138" font-size="16" font-weight="700">Current ratio</text>
    <text x="16" y="172" font-size="21">400 ÷ 200 = 200%</text>
    <rect x="16" y="187" width="288" height="18" fill="#566842"/>
    <text x="16" y="248" font-size="16" font-weight="700">Quick ratio</text>
    <text x="16" y="282" font-size="21">(400 − 200) ÷ 200 = 100%</text>
    <rect x="16" y="297" width="144" height="18" fill="#566842"/>
    <text x="16" y="358" font-size="16" font-weight="700">Cash ratio</text>
    <text x="16" y="392" font-size="21">50 ÷ 200 = 25%</text>
    <rect x="16" y="407" width="36" height="18" fill="#566842"/>
    <text x="16" y="463" font-size="13">Each denominator: closing current liabilities 200</text>
    <text x="16" y="494" font-size="13">Not industry pass marks or payment guarantees.</text>
  </g>
</svg>
