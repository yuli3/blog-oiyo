<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">同一负债分母，三种流动性比率</title>
  <desc id="desc">FA公司20X2年末流动比率为400/200 = 200%，速动比率为(400 − 200)/200 = 100%，现金比率为50/200 = 25%。排除存货后分子缩小。条形使用同一比率尺度；这些数值不是行业合格线，也不保证未来偿付能力。</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">同一负债分母，三种流动性比率</text>
    <text x="16" y="61" font-size="15">单位：%</text>
    <text x="16" y="90" font-size="15">虚构FA公司 · 20X2年末</text>
    <text x="16" y="138" font-size="16" font-weight="700">流动比率</text>
    <text x="16" y="172" font-size="21">400 ÷ 200 = 200%</text>
    <rect x="16" y="187" width="288" height="18" fill="#566842"/>
    <text x="16" y="248" font-size="16" font-weight="700">速动比率</text>
    <text x="16" y="282" font-size="21">(400 − 200) ÷ 200 = 100%</text>
    <rect x="16" y="297" width="144" height="18" fill="#566842"/>
    <text x="16" y="358" font-size="16" font-weight="700">现金比率</text>
    <text x="16" y="392" font-size="21">50 ÷ 200 = 25%</text>
    <rect x="16" y="407" width="36" height="18" fill="#566842"/>
    <text x="16" y="463" font-size="13">分母均为期末流动负债200</text>
    <text x="16" y="494" font-size="13">不是行业合格线或偿付保证。</text>
  </g>
</svg>
