<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 750" width="640" height="750" role="img" aria-labelledby="title desc">
  <title id="title">매출과 현금은 서로 다른 때에 움직입니다</title>
  <desc id="desc">서비스 500만 원을 제공하면 매출과 매출채권이 각각 500만 원 생깁니다. 대금 200만 원을 회수하면 현금이 200만 원 늘고 매출채권이 200만 원 줄지만 추가 매출은 없습니다. 임차료 100만 원을 지급하면 비용과 현금 유출이 생깁니다. 이 예의 이익은 400만 원, 영업현금흐름은 100만 원입니다.</desc>
  <rect width="640" height="750" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">매출과 현금의 시점 차이</text>
    <text x="32" y="80" font-size="19">학습 예시 · 단위: 만 원 · 거래 ④~⑥</text>
    <rect x="24" y="108" width="592" height="138" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="144" font-size="23" font-weight="700">④ 서비스 제공 · 대금은 나중에</text>
    <text x="44" y="181" font-size="22">매출 +500 / 매출채권 +500</text>
    <text x="44" y="216" font-size="21">현금 변화 없음</text>
    <path d="M320 252v25m-8-9 8 9 8-9" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="288" width="592" height="138" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="324" font-size="23" font-weight="700">⑤ 대금 일부 회수</text>
    <text x="44" y="361" font-size="22">현금 +200 / 매출채권 −200</text>
    <text x="44" y="396" font-size="21">추가 매출 없음 · 남은 채권 300</text>
    <path d="M320 432v25m-8-9 8 9 8-9" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="468" width="592" height="112" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="504" font-size="23" font-weight="700">⑥ 이달 임차료 지급</text>
    <text x="44" y="544" font-size="22">비용 +100 / 현금 −100</text>
    <rect x="24" y="606" width="592" height="120" rx="12" fill="#e9eddf"/>
    <text x="44" y="646" font-size="24" font-weight="700">이익: 500 − 100 = 400</text>
    <text x="44" y="689" font-size="24" font-weight="700">영업현금흐름: 200 − 100 = 100</text>
  </g>
</svg>
