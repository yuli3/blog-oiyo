<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">운전자본 1,100만 원은 현금 1,200만 원과 다르다</title>
  <desc id="desc">유동자산 1,500만 원에서 유동부채 400만 원을 빼면 운전자본 1,100만 원입니다. 현금 1,200만 원과 다르고, 매출채권 300만 원은 아직 받지 못했습니다.</desc>
  <rect width="640" height="400" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">운전자본 ≠ 현금</text>
    <text x="32" y="80" font-size="19">확인일 2026-09-01 · 365일 환산 아님</text>
    <rect x="24" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="152" font-size="20">현금</text>
    <text x="44" y="200" font-size="28" font-weight="700">1,200만 원</text>
    <text x="44" y="236" font-size="18">받은 돈</text>
    <rect x="332" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="352" y="152" font-size="20">운전자본</text>
    <text x="352" y="200" font-size="28" font-weight="700">1,100만 원</text>
    <text x="352" y="236" font-size="18">1,500 − 400</text>
    <rect x="24" y="288" width="592" height="84" rx="12" fill="#e9eddf"/>
    <text x="44" y="324" font-size="22" font-weight="700">매출채권 300만 원은 아직 미회수</text>
    <text x="44" y="356" font-size="20">재고 0 · 당좌비율 = 유동비율 375%</text>
  </g>
</svg>
