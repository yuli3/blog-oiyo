<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">현금과 두 가지 운전자본</title>
  <desc id="desc">FA사의 20X2년 말 현금은 50억 원이다. 총순운전자본은 유동자산 400 − 유동부채 200 = 200억 원이다. 이 사례의 영업순운전자본은 매출채권 150 + 재고 200 − 매입채무 120 = 230억 원으로, 현금과 금융차입은 제외한다. 이는 현금 잔액이나 즉시 지급 가능한 자금과 같은 개념이 아니다.</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">현금과 두 가지 운전자본</text>
    <text x="16" y="61" font-size="15">단위: 억 원 (KRW)</text>
    <text x="16" y="90" font-size="15">가상 FA사 · 20X2년 말</text>
    <text x="16" y="138" font-size="16" font-weight="700">현금</text>
    <text x="16" y="175" font-size="23">50</text>
    <text x="16" y="248" font-size="16" font-weight="700">총순운전자본</text>
    <text x="16" y="285" font-size="23">400 − 200 = 200</text>
    <text x="16" y="358" font-size="16" font-weight="700">영업순운전자본</text>
    <text x="16" y="395" font-size="23">150 + 200 − 120 = 230</text>
    <text x="16" y="463" font-size="13">영업순운전자본은 현금·금융차입을 제외</text>
    <text x="16" y="494" font-size="13">정의가 다르므로 같은 금액이 아니다.</text>
  </g>
</svg>
