<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Umbrales de una sociedad coreana</title>
  <desc id="desc">Activo A: 150 ≥ 120. Pasivo L: 80 ≥ 70. Ventas S: 90 &lt; 100. Empleados E: 60 &lt; 100. Se cumplen dos de cuatro criterios. Sociedad anónima no cotizada · ejercicio de 12 meses. Se supone que no hay exclusión legal</desc>
  <!-- 2026-10-01: Same chapter case; this tests size only, not listing status or statutory exclusions. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="15" font-weight="700">Umbrales de una sociedad coreana</text>
    <text x="16" y="62" font-size="12">Importes: 100 millones KRW · E: personas</text>
    <text x="16" y="108" font-size="15" font-weight="700">Activo A</text>
    <text x="16" y="138" font-size="20">150 ≥ 120</text>
    <text x="304" y="138" font-size="14" text-anchor="end">Sí</text>
    <text x="16" y="186" font-size="15" font-weight="700">Pasivo L</text>
    <text x="16" y="216" font-size="20">80 ≥ 70</text>
    <text x="304" y="216" font-size="14" text-anchor="end">Sí</text>
    <text x="16" y="264" font-size="15" font-weight="700">Ventas S</text>
    <text x="16" y="294" font-size="20">90 &lt; 100</text>
    <text x="304" y="294" font-size="14" text-anchor="end">No</text>
    <text x="16" y="342" font-size="15" font-weight="700">Empleados E</text>
    <text x="16" y="372" font-size="20">60 &lt; 100</text>
    <text x="304" y="372" font-size="14" text-anchor="end">No</text>
    <path d="M16 395H304" stroke="#a7b099"/>
    <text x="16" y="434" font-size="14" font-weight="700">Se cumplen dos de cuatro criterios</text>
    <text x="16" y="486" font-size="13">Sociedad no cotizada · ejercicio de 12 meses</text>
    <text x="16" y="516" font-size="13">Sin exclusión legal, por hipótesis</text>
  </g>
</svg>
