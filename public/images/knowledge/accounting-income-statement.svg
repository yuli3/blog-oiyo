<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="title desc">
  <title id="title">한 달 손익 500만 원 매출에서 이익 400만 원</title>
  <desc id="desc">매출 500만 원에서 매출원가 0을 빼면 매출총이익 500만 원입니다. 임차료 100만 원을 빼면 영업이익과 당기순이익이 400만 원입니다. 같은 달 현금 회수 200만 원에서 임차료 지급 100만 원을 빼면 영업현금흐름은 100만 원입니다.</desc>
  <rect width="640" height="560" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">손익계산서와 영업현금흐름</text>
    <text x="32" y="80" font-size="19">1장과 같은 회사 · 단위: 만 원</text>
    <rect x="24" y="108" width="592" height="88" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="144" font-size="22" font-weight="700">매출 500</text>
    <text x="44" y="176" font-size="20">매출원가 0 · 서비스만 제공</text>
    <path d="M320 202v22m-8-8 8 8 8-8" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="232" width="592" height="72" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="276" font-size="22" font-weight="700">매출총이익 500</text>
    <path d="M320 310v22m-8-8 8 8 8-8" fill="none" stroke="#566842" stroke-width="3"/>
    <rect x="24" y="340" width="592" height="72" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="384" font-size="22" font-weight="700">임차료 100을 빼면 영업이익 400</text>
    <rect x="24" y="432" width="592" height="100" rx="12" fill="#e9eddf"/>
    <text x="44" y="472" font-size="23" font-weight="700">당기순이익 400 · 이자·세금 생략</text>
    <text x="44" y="508" font-size="21">영업현금흐름 200 − 100 = 100</text>
  </g>
</svg>
