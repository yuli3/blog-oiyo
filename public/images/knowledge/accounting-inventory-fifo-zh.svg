<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">同一存货，三种成本分配</title>
  <desc id="desc">将可供销售存货730,000韩元分配为营业成本和期末存货：先进先出法470,000/260,000，移动加权平均法474,762/255,238，定期加权平均法486,667/243,333韩元。平均法在计算过程中保留精度，最终金额四舍五入至韩元。尚未计入盘亏及减值。</desc>
  <!-- 2026-10-01: Match chapter 8, including opening inventory; bars allocate cost, not sales revenue. -->
  <rect width="320" height="640" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">同一存货，三种成本分配</text>
    <text x="16" y="61" font-size="15">单位：韩元（KRW）</text>
    <text x="16" y="102" font-size="28" font-weight="700">730,000</text>
    <text x="16" y="133" font-size="15">可供销售600件 · 销售400 · 期末200</text>
    <text x="16" y="178" font-size="16" font-weight="700">先进先出法</text>
    <text x="16" y="208" font-size="16">营业成本 470,000</text>
    <text x="16" y="236" font-size="16">期末存货 260,000</text>
    <rect x="16" y="254" width="185.42465753424656" height="24" fill="#566842"/>
    <rect x="201.42465753424656" y="254" width="102.57534246575344" height="24" fill="#c4ceb7"/>
    <text x="16" y="322" font-size="16" font-weight="700">移动加权平均法</text>
    <text x="16" y="352" font-size="16">营业成本 474,762</text>
    <text x="16" y="380" font-size="16">期末存货 255,238</text>
    <rect x="16" y="398" width="187.30336438356164" height="24" fill="#566842"/>
    <rect x="203.30336438356164" y="398" width="100.69663561643836" height="24" fill="#c4ceb7"/>
    <text x="16" y="466" font-size="16" font-weight="700">定期加权平均法</text>
    <text x="16" y="496" font-size="16">营业成本 486,667</text>
    <text x="16" y="524" font-size="16">期末存货 243,333</text>
    <rect x="16" y="542" width="192.00013150684933" height="24" fill="#566842"/>
    <rect x="208.00013150684933" y="542" width="95.99986849315067" height="24" fill="#c4ceb7"/>
    <text x="16" y="590" font-size="15">每种方法的分配合计：730,000</text>
    <text x="16" y="622" font-size="13">盘亏及减值前 · 最终金额取整至韩元</text>
  </g>
</svg>
