<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" width="320" height="588" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Amortissement linéaire : an 1</title>
  <desc id="desc">Première année en linéaire : (1 000 − 100) ÷ 5 = 180 ; valeur comptable : 1 000 − 180 = 820 (unité : 10 000 KRW). La machine est supposée prête à être utilisée dès le 1er janvier. L’amortissement n’est pas un paiement. Il se distingue du règlement de la machine.</desc>
  <!-- 2026-10-01: Match accounting-principles chapter 9; the 18%/82% bar is cost allocation, not market value. -->
  <rect width="320" height="588" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">Amortissement linéaire : an 1</text>
    <text x="16" y="60" font-size="15">Unité : 10 000 KRW</text>
    <text x="16" y="99" font-size="16">Coût d’acquisition</text>
    <text x="16" y="135" font-size="28" font-weight="700">1 000</text>
    <text x="16" y="163" font-size="15">Valeur résiduelle 100 · Durée 5 ans</text>
    <path d="M160 176v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="230" font-size="16">Amortissement de l’an 1</text>
    <text x="16" y="263" font-size="21" font-weight="700">(1 000 − 100) ÷ 5 = 180</text>
    <path d="M160 279v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="334" font-size="16">Valeur comptable en fin d’an 1</text>
    <text x="16" y="367" font-size="23" font-weight="700">1 000 − 180 = 820</text>
    <text x="16" y="411" font-size="15">Coût réparti et valeur comptable</text>
    <rect x="16" y="430" width="51.84" height="32" fill="#566842"/>
    <rect x="67.84" y="430" width="236.16" height="32" fill="#c4ceb7"/>
    <text x="16" y="490" font-size="15">Cumul 180</text>
    <text x="304" y="490" font-size="15" text-anchor="end">Valeur 820</text>
    <text x="16" y="536" font-size="15">L’amortissement n’est pas un paiement.</text>
    <text x="16" y="563" font-size="15">Il se distingue du règlement de la machine.</text>
  </g>
</svg>
