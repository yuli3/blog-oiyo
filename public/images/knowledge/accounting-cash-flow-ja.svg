<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 537" width="480" height="537" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">現金の流れを三つに分ける</title>
  <desc id="desc">単位：万ウォン · 第1章と同じ事例. 営業活動. 投資活動. 財務活動. 純増加：100 − 300 + 1,400 = 1,200. 直接法の営業現金：200 − 100 = 100. 期首 0 → 期末 1,200. 現金の増加と利益400は別の数字</desc>
  <rect width="480" height="537" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="125" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="254" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="416" width="448" height="83" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">現金の流れを三つに分ける</text>
    <text x="28" y="74" font-size="21">単位：万ウォン · 第1章と同じ</text>
    <text x="28" y="104" font-size="21">事例</text>
    <text x="28" y="150" font-size="24">営業活動: +100</text>
    <text x="28" y="183" font-size="24">投資活動: −300</text>
    <text x="28" y="216" font-size="24">財務活動: +1,400</text>
    <text x="28" y="279" font-size="24">純増加：100 − 300</text>
    <text x="28" y="312" font-size="24">+ 1,400 = 1,200</text>
    <text x="28" y="345" font-size="24">直接法の営業現金：200</text>
    <text x="28" y="378" font-size="24">− 100 = 100</text>
    <text x="28" y="441" font-size="24" font-weight="700">期首 0 → 期末 1,200</text>
    <text x="28" y="474" font-size="24" font-weight="700">現金の増加と利益400は別の数字</text>
  </g>
</svg>
