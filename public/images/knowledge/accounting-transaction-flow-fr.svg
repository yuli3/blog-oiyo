<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 766" width="480" height="766" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="fr">
  <title id="title">Chiffre d'affaires et trésorerie : deux dates</title>
  <desc id="desc">Unité : 10 000 KRW · Même exemple qu'au chapitre 1. ④ Prestation à crédit. Chiffre d'affaires +500 / Créances +500. Aucun mouvement de trésorerie. ⑤ Encaissement partiel d'une créance. Trésorerie +200 / Créances −200. Pas de nouveau produit · Créances restantes : 300. ⑥ Paiement du loyer du mois. Charge +100 / Trésorerie −100. Résultat : 500 − 100 = 400. Flux d'exploitation : 200 − 100 = 100</desc>
  <rect width="480" height="766" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="159" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 312v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="321" width="448" height="182" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 507v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="516" width="448" height="83" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="612" width="448" height="116" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">Chiffre d'affaires et trésorerie</text>
    <text x="28" y="74" font-size="25" font-weight="700">: deux dates</text>
    <text x="28" y="108" font-size="21">Unité : 10 000 KRW · Même</text>
    <text x="28" y="138" font-size="21">exemple qu'au chapitre 1</text>
    <text x="28" y="184" font-size="24">④ Prestation à crédit</text>
    <text x="28" y="217" font-size="24">Chiffre d'affaires +500 /</text>
    <text x="28" y="250" font-size="24">Créances +500</text>
    <text x="28" y="283" font-size="24">Aucun mouvement de trésorerie</text>
    <text x="28" y="346" font-size="24">⑤ Encaissement partiel d'une</text>
    <text x="28" y="379" font-size="24">créance</text>
    <text x="28" y="412" font-size="24">Trésorerie +200 / Créances −200</text>
    <text x="28" y="445" font-size="24">Pas de nouveau produit ·</text>
    <text x="28" y="478" font-size="24">Créances restantes : 300</text>
    <text x="28" y="541" font-size="24">⑥ Paiement du loyer du mois</text>
    <text x="28" y="574" font-size="24">Charge +100 / Trésorerie −100</text>
    <text x="28" y="637" font-size="24" font-weight="700">Résultat : 500 − 100 = 400</text>
    <text x="28" y="670" font-size="24" font-weight="700">Flux d'exploitation : 200 − 100</text>
    <text x="28" y="703" font-size="24" font-weight="700">= 100</text>
  </g>
</svg>
