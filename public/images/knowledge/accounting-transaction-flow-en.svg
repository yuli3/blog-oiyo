<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" width="480" height="700" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">Revenue and cash move at different times</title>
  <desc id="desc">Unit: KRW 10,000 · Same example as chapter 1. ④ Provide services on credit. Revenue +500 / Receivables +500. No cash movement. ⑤ Collect part of the receivable. Cash +200 / Receivables −200. No new revenue · Receivables remaining: 300. ⑥ Pay this month's rent. Expense +100 / Cash −100. Profit: 500 − 100 = 400. Operating cash flow: 200 − 100 = 100</desc>
  <rect width="480" height="700" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="159" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 279v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="288" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 441v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="450" width="448" height="83" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="546" width="448" height="116" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">Revenue and cash move at</text>
    <text x="28" y="74" font-size="25" font-weight="700">different times</text>
    <text x="28" y="108" font-size="21">Unit: KRW 10,000 · Same example</text>
    <text x="28" y="138" font-size="21">as chapter 1</text>
    <text x="28" y="184" font-size="24">④ Provide services on credit</text>
    <text x="28" y="217" font-size="24">Revenue +500 / Receivables +500</text>
    <text x="28" y="250" font-size="24">No cash movement</text>
    <text x="28" y="313" font-size="24">⑤ Collect part of the receivable</text>
    <text x="28" y="346" font-size="24">Cash +200 / Receivables −200</text>
    <text x="28" y="379" font-size="24">No new revenue · Receivables</text>
    <text x="28" y="412" font-size="24">remaining: 300</text>
    <text x="28" y="475" font-size="24">⑥ Pay this month's rent</text>
    <text x="28" y="508" font-size="24">Expense +100 / Cash −100</text>
    <text x="28" y="571" font-size="24" font-weight="700">Profit: 500 − 100 = 400</text>
    <text x="28" y="604" font-size="24" font-weight="700">Operating cash flow: 200 − 100 =</text>
    <text x="28" y="637" font-size="24" font-weight="700">100</text>
  </g>
</svg>
