<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 798" width="480" height="798" style="width:100%;max-width:480px;height:auto" role="img" aria-labelledby="title desc" lang="ja">
  <title id="title">売上と現金は動く時点が異なる</title>
  <desc id="desc">単位：万ウォン · 第1章と同じ事例. ④ サービスを提供・代金は後払い. 売上 +500 / 売掛金 +500. 現金の変動なし. ⑤ 売掛金の一部を回収. 現金 +200 / 売掛金 −200. 追加の売上なし · 売掛金残高 300. ⑥ 当月の家賃を支払う. 費用 +100 / 現金 −100. 利益：500 − 100 = 400. 営業キャッシュフロー：200 − 100 = 100</desc>
  <rect width="480" height="798" rx="20" fill="#f7f7f2"/>
  <rect x="16" y="125" width="448" height="149" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 278v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="287" width="448" height="182" rx="12" fill="#fff" stroke="#a7b099"/>
  <path d="M240 473v20m-6-6 6 6 6-6" fill="none" stroke="#566842" stroke-width="2"/>
  <rect x="16" y="482" width="448" height="116" rx="12" fill="#fff" stroke="#a7b099"/>
  <rect x="16" y="611" width="448" height="149" rx="12" fill="#e9eddf" stroke="#a7b099"/>
  <g font-family="Arial, Noto Sans, sans-serif" fill="#263021">
    <text x="28" y="40" font-size="25" font-weight="700">売上と現金は動く時点が異なる</text>
    <text x="28" y="74" font-size="21">単位：万ウォン · 第1章と同じ</text>
    <text x="28" y="104" font-size="21">事例</text>
    <text x="28" y="150" font-size="24">④ サービスを提供・代金は後払い</text>
    <text x="28" y="183" font-size="24">売上 +500 / 売掛金</text>
    <text x="28" y="216" font-size="24">+500</text>
    <text x="28" y="249" font-size="24">現金の変動なし</text>
    <text x="28" y="312" font-size="24">⑤ 売掛金の一部を回収</text>
    <text x="28" y="345" font-size="24">現金 +200 / 売掛金</text>
    <text x="28" y="378" font-size="24">−200</text>
    <text x="28" y="411" font-size="24">追加の売上なし · 売掛金残高</text>
    <text x="28" y="444" font-size="24">300</text>
    <text x="28" y="507" font-size="24">⑥ 当月の家賃を支払う</text>
    <text x="28" y="540" font-size="24">費用 +100 / 現金</text>
    <text x="28" y="573" font-size="24">−100</text>
    <text x="28" y="636" font-size="24" font-weight="700">利益：500 − 100 =</text>
    <text x="28" y="669" font-size="24" font-weight="700">400</text>
    <text x="28" y="702" font-size="24" font-weight="700">営業キャッシュフロー：200</text>
    <text x="28" y="735" font-size="24" font-weight="700">− 100 = 100</text>
  </g>
</svg>
