<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 588" width="320" height="588" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Straight-line: the first year</title>
  <desc id="desc">First-year straight-line depreciation: (1,000 − 100) ÷ 5 = 180, leaving a carrying amount of 1,000 − 180 = 820 (unit: KRW 10,000). The machine is assumed available for use from 1 January. Depreciation itself is not a cash payment. Separate it from paying for the machine.</desc>
  <!-- 2026-10-01: Match accounting-principles chapter 9; the 18%/82% bar is cost allocation, not market value. -->
  <rect width="320" height="588" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">Straight-line: the first year</text>
    <text x="16" y="60" font-size="15">Unit: KRW 10,000</text>
    <text x="16" y="99" font-size="16">Acquisition cost</text>
    <text x="16" y="135" font-size="28" font-weight="700">1,000</text>
    <text x="16" y="163" font-size="15">Residual 100 · Useful life 5 years</text>
    <path d="M160 176v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="230" font-size="16">First-year depreciation</text>
    <text x="16" y="263" font-size="21" font-weight="700">(1,000 − 100) ÷ 5 = 180</text>
    <path d="M160 279v24m-7-7 7 7 7-7" fill="none" stroke="#566842" stroke-width="2"/>
    <text x="16" y="334" font-size="16">Year-end carrying amount</text>
    <text x="16" y="367" font-size="23" font-weight="700">1,000 − 180 = 820</text>
    <text x="16" y="411" font-size="15">Allocated cost and carrying amount</text>
    <rect x="16" y="430" width="51.84" height="32" fill="#566842"/>
    <rect x="67.84" y="430" width="236.16" height="32" fill="#c4ceb7"/>
    <text x="16" y="490" font-size="15">Accumulated 180</text>
    <text x="304" y="490" font-size="15" text-anchor="end">Carrying 820</text>
    <text x="16" y="536" font-size="15">Depreciation itself is not a cash payment.</text>
    <text x="16" y="563" font-size="15">Separate it from paying for the machine.</text>
  </g>
</svg>
