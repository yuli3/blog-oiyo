<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 676" width="320" height="676" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">TA사의 당기순이익에서 각사업연도소득까지</title>
  <desc id="desc">단위는 만 원이다. 당기순이익 5,000에 법인세비용 1,000, 기업업무추진비 한도 초과 300, 상각부인액 400, 과태료 50, 개인 여행 경비 200을 더하고 미수이자 100을 빼면 각사업연도소득 6,850이다. 이 금액은 과세표준이나 납부세액이 아니다.</desc>
  <!-- 2026-10-01: Use the chapter's TA example, not a second invented company; tax base and tax payable require further steps. -->
  <rect width="320" height="676" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">TA사의 세무조정</text>
    <text x="16" y="60" font-size="14">가상 사례 · 2026 사업연도 · 만 원</text>
    <text x="16" y="104" font-size="15">결산서 당기순이익</text>
    <text x="16" y="140" font-size="25" font-weight="700">5,000</text>
    <path d="M16 162H304" stroke="#a7b099"/>
    <text x="16" y="192" font-size="15" font-weight="700">가산: 손금불산입</text>
    <text x="16" y="230" font-size="14">법인세비용</text><text x="304" y="230" font-size="16" text-anchor="end">+1,000</text>
    <text x="16" y="266" font-size="14">기업업무추진비 한도 초과</text><text x="304" y="266" font-size="16" text-anchor="end">+300</text>
    <text x="16" y="302" font-size="14">감가상각비 상각부인액</text><text x="304" y="302" font-size="16" text-anchor="end">+400</text>
    <text x="16" y="338" font-size="14">교통법규 위반 과태료</text><text x="304" y="338" font-size="16" text-anchor="end">+50</text>
    <text x="16" y="374" font-size="14">대표이사 개인 여행 경비</text><text x="304" y="374" font-size="16" text-anchor="end">+200</text>
    <path d="M16 396H304" stroke="#a7b099"/>
    <text x="16" y="426" font-size="15" font-weight="700">차감: 익금불산입</text>
    <text x="16" y="462" font-size="14">원천징수 대상 미수이자</text><text x="304" y="462" font-size="16" text-anchor="end">−100</text>
    <rect x="16" y="488" width="288" height="92" rx="12" fill="#e9eddf"/>
    <text x="30" y="518" font-size="15">각사업연도소득</text>
    <text x="30" y="554" font-size="25" font-weight="700">6,850</text>
    <text x="16" y="616" font-size="13">이후 소득공제 등을 반영해 과세표준 계산</text>
    <text x="16" y="646" font-size="14">6,850은 납부세액이 아니다.</text>
  </g>
</svg>
