<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">회계이익 400에서 가상 조정 20을 더해도 납부세액이 아니다</title>
  <desc id="desc">학습용 회계이익 400만 원에 이 회사에 없는 손금불산입 20만 원을 더하면 420만 원입니다. 이 숫자에 세율을 곱한 값을 법인세 납부액이라고 하지 않습니다.</desc>
  <rect width="640" height="420" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">조정은 곱하기가 아니다</text>
    <text x="32" y="80" font-size="19">학습용 · 단위: 만 원 · 신고 아님</text>
    <rect x="24" y="108" width="184" height="120" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="152" font-size="20">회계이익</text>
    <text x="44" y="196" font-size="28" font-weight="700">400</text>
    <rect x="228" y="108" width="184" height="120" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="248" y="152" font-size="20">가상 손금불산입</text>
    <text x="248" y="196" font-size="28" font-weight="700">+20</text>
    <rect x="432" y="108" width="184" height="120" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="452" y="152" font-size="20">조정 후</text>
    <text x="452" y="196" font-size="28" font-weight="700">420</text>
    <rect x="24" y="252" width="592" height="136" rx="12" fill="#e9eddf"/>
    <text x="44" y="300" font-size="22" font-weight="700">420 × 10%를 납부세액이라 하지 않음</text>
    <text x="44" y="340" font-size="20">사업연도 · 공제 · 지방소득세를 빼 둠</text>
    <text x="44" y="372" font-size="20">접대비 20은 1~6장 거래에 없음</text>
  </g>
</svg>
