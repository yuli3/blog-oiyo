<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">한 달 이익률과 부채비율, 연환산하지 않음</title>
  <desc id="desc">학습용 한 달 이익률은 80%, 부채비율은 약 28.6%입니다. 이 숫자를 12배로 늘려 연간 실적이라고 하지 않습니다.</desc>
  <rect width="640" height="400" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">한 달 스냅샷, 연간 진단 아님</text>
    <text x="32" y="80" font-size="19">확인일 2026-09-01 · 업종 평균 아님</text>
    <rect x="24" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="152" font-size="20">매출액순이익률</text>
    <text x="44" y="200" font-size="28" font-weight="700">80%</text>
    <text x="44" y="236" font-size="18">400 ÷ 500 · 임차료만</text>
    <rect x="332" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="352" y="152" font-size="20">부채비율</text>
    <text x="352" y="200" font-size="28" font-weight="700">약 28.6%</text>
    <text x="352" y="236" font-size="18">400 ÷ 1,400</text>
    <rect x="24" y="288" width="592" height="84" rx="12" fill="#e9eddf"/>
    <text x="44" y="324" font-size="22" font-weight="700">400 × 12를 연간 이익이라 하지 않음</text>
    <text x="44" y="356" font-size="20">유동비율 375%도 6개월 만기 가정</text>
  </g>
</svg>
