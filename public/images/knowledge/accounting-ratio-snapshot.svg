<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">같은 부채, 다른 유동성 비율</title>
  <desc id="desc">FA사의 20X2년 말 유동비율은 400/200 = 200%, 당좌비율은 (400 − 200)/200 = 100%, 현금비율은 50/200 = 25%다. 재고를 제외할수록 분자가 줄어든다. 막대는 같은 비율 척도를 사용하며, 이 수치는 업종의 합격선이나 미래 지급능력의 보장이 아니다.</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">같은 부채, 다른 유동성 비율</text>
    <text x="16" y="61" font-size="15">단위: %</text>
    <text x="16" y="90" font-size="15">가상 FA사 · 20X2년 말</text>
    <text x="16" y="138" font-size="16" font-weight="700">유동비율</text>
    <text x="16" y="172" font-size="21">400 ÷ 200 = 200%</text>
    <rect x="16" y="187" width="288" height="18" fill="#566842"/>
    <text x="16" y="248" font-size="16" font-weight="700">당좌비율</text>
    <text x="16" y="282" font-size="21">(400 − 200) ÷ 200 = 100%</text>
    <rect x="16" y="297" width="144" height="18" fill="#566842"/>
    <text x="16" y="358" font-size="16" font-weight="700">현금비율</text>
    <text x="16" y="392" font-size="21">50 ÷ 200 = 25%</text>
    <rect x="16" y="407" width="36" height="18" fill="#566842"/>
    <text x="16" y="463" font-size="13">모두 기말 유동부채 200을 분모로 사용</text>
    <text x="16" y="494" font-size="13">업종 합격선이나 지급 보장이 아니다.</text>
  </g>
</svg>
