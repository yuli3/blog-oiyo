<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="title desc">
  <title id="title">매입 440만 원을 FIFO와 평균법으로 나누면</title>
  <desc id="desc">10개 20만 원과 10개 24만 원을 사고 15개를 팝니다. FIFO 매출원가 320, 기말 120. 가중평균 매출원가 330, 기말 110. 합은 둘 다 440만 원입니다.</desc>
  <rect width="640" height="520" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">같은 매입, 다른 배분</text>
    <text x="32" y="80" font-size="19">20개 매입 440 · 15개 판매 · 단위: 만 원</text>
    <rect x="24" y="108" width="284" height="220" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="148" font-size="22" font-weight="700">FIFO</text>
    <text x="44" y="188" font-size="20">매출원가 320</text>
    <text x="44" y="224" font-size="20">10×20 + 5×24</text>
    <text x="44" y="268" font-size="20">기말 5×24 = 120</text>
    <rect x="332" y="108" width="284" height="220" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="352" y="148" font-size="22" font-weight="700">가중평균</text>
    <text x="352" y="188" font-size="20">매출원가 330</text>
    <text x="352" y="224" font-size="20">15×22</text>
    <text x="352" y="268" font-size="20">기말 5×22 = 110</text>
    <rect x="24" y="348" width="592" height="140" rx="12" fill="#e9eddf"/>
    <text x="44" y="396" font-size="23" font-weight="700">320 + 120 = 440</text>
    <text x="44" y="436" font-size="23" font-weight="700">330 + 110 = 440</text>
    <text x="44" y="472" font-size="20">매입 총액은 방법이 바꿔도 같다</text>
  </g>
</svg>
