<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">같은 재고, 세 가지 원가 배분</title>
  <desc id="desc">판매가능재고 730,000원을 매출원가와 기말 재고로 배분한다. 선입선출법 470,000/260,000원, 이동평균법 474,762/255,238원, 총평균법 486,667/243,333원이다. 평균법은 계산 중 정밀도를 유지하고 최종 금액을 원 단위로 반올림했다. 감모·평가손실 반영 전이다.</desc>
  <!-- 2026-10-01: Match chapter 8, including opening inventory; bars allocate cost, not sales revenue. -->
  <rect width="320" height="640" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">같은 재고, 세 가지 원가 배분</text>
    <text x="16" y="61" font-size="15">단위: 원 (KRW)</text>
    <text x="16" y="102" font-size="28" font-weight="700">730,000</text>
    <text x="16" y="133" font-size="15">판매가능 600개 · 판매 400 · 기말 200</text>
    <text x="16" y="178" font-size="16" font-weight="700">선입선출법</text>
    <text x="16" y="208" font-size="16">매출원가 470,000</text>
    <text x="16" y="236" font-size="16">기말 재고 260,000</text>
    <rect x="16" y="254" width="185.42465753424656" height="24" fill="#566842"/>
    <rect x="201.42465753424656" y="254" width="102.57534246575344" height="24" fill="#c4ceb7"/>
    <text x="16" y="322" font-size="16" font-weight="700">이동평균법</text>
    <text x="16" y="352" font-size="16">매출원가 474,762</text>
    <text x="16" y="380" font-size="16">기말 재고 255,238</text>
    <rect x="16" y="398" width="187.30336438356164" height="24" fill="#566842"/>
    <rect x="203.30336438356164" y="398" width="100.69663561643836" height="24" fill="#c4ceb7"/>
    <text x="16" y="466" font-size="16" font-weight="700">총평균법</text>
    <text x="16" y="496" font-size="16">매출원가 486,667</text>
    <text x="16" y="524" font-size="16">기말 재고 243,333</text>
    <rect x="16" y="542" width="192.00013150684933" height="24" fill="#566842"/>
    <rect x="208.00013150684933" y="542" width="95.99986849315067" height="24" fill="#c4ceb7"/>
    <text x="16" y="590" font-size="15">각 방법의 배분 합계: 730,000</text>
    <text x="16" y="622" font-size="13">감모·평가손실 반영 전 · 원 단위 반올림</text>
  </g>
</svg>
