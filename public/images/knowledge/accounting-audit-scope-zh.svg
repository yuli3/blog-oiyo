<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">韩国股份公司的规模条件</title>
  <desc id="desc">资产 A: 150 ≥ 120. 负债 L: 80 ≥ 70. 营业收入 S: 90 &lt; 100. 员工 E: 60 &lt; 100. 四项中满足两项. 非上市股份公司 · 12个月会计年度. 假设不存在法定排除情形</desc>
  <!-- 2026-10-01: Same chapter case; this tests size only, not listing status or statutory exclusions. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="15" font-weight="700">韩国股份公司的规模条件</text>
    <text x="16" y="62" font-size="12">金额：亿韩元 · 人数：人</text>
    <text x="16" y="108" font-size="15" font-weight="700">资产 A</text>
    <text x="16" y="138" font-size="20">150 ≥ 120</text>
    <text x="304" y="138" font-size="14" text-anchor="end">满足</text>
    <text x="16" y="186" font-size="15" font-weight="700">负债 L</text>
    <text x="16" y="216" font-size="20">80 ≥ 70</text>
    <text x="304" y="216" font-size="14" text-anchor="end">满足</text>
    <text x="16" y="264" font-size="15" font-weight="700">营业收入 S</text>
    <text x="16" y="294" font-size="20">90 &lt; 100</text>
    <text x="304" y="294" font-size="14" text-anchor="end">不满足</text>
    <text x="16" y="342" font-size="15" font-weight="700">员工 E</text>
    <text x="16" y="372" font-size="20">60 &lt; 100</text>
    <text x="304" y="372" font-size="14" text-anchor="end">不满足</text>
    <path d="M16 395H304" stroke="#a7b099"/>
    <text x="16" y="434" font-size="14" font-weight="700">四项中满足两项</text>
    <text x="16" y="486" font-size="13">非上市股份公司 · 12个月会计年度</text>
    <text x="16" y="516" font-size="13">假设无任何法定排除情形</text>
  </g>
</svg>
