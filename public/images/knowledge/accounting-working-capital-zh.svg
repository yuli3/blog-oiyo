<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="zh">
  <title id="title">现金与两种营运资本</title>
  <desc id="desc">FA公司20X2年末现金为50亿韩元。净营运资本为流动资产400 − 流动负债200 = 200亿韩元。本例经营性净营运资本为应收账款150 + 存货200 − 应付账款120 = 230亿韩元，排除现金和金融借款。它不等于现金余额或可立即支付的资金。</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">现金与两种营运资本</text>
    <text x="16" y="61" font-size="15">单位：亿韩元（KRW）</text>
    <text x="16" y="90" font-size="15">虚构FA公司 · 20X2年末</text>
    <text x="16" y="138" font-size="16" font-weight="700">现金</text>
    <text x="16" y="175" font-size="23">50</text>
    <text x="16" y="248" font-size="16" font-weight="700">净营运资本</text>
    <text x="16" y="285" font-size="23">400 − 200 = 200</text>
    <text x="16" y="358" font-size="16" font-weight="700">经营性净营运资本</text>
    <text x="16" y="395" font-size="23">150 + 200 − 120 = 230</text>
    <text x="16" y="463" font-size="13">经营性指标排除现金和金融借款。</text>
    <text x="16" y="494" font-size="13">定义不同，不能混为同一金额。</text>
  </g>
</svg>
