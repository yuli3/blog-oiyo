<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">現金と二つの運転資本</title>
  <desc id="desc">FA社の20X2年末の現金は50億ウォン。正味運転資本は流動資産400 − 流動負債200 = 200億ウォン。この例の営業正味運転資本は売掛金150 + 棚卸資産200 − 買掛金120 = 230億ウォンで、現金と金融借入を除く。現金残高や直ちに支払える資金と同じ概念ではない。</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">現金と二つの運転資本</text>
    <text x="16" y="61" font-size="15">単位：億ウォン（KRW）</text>
    <text x="16" y="90" font-size="15">架空のFA社・20X2年末</text>
    <text x="16" y="138" font-size="16" font-weight="700">現金</text>
    <text x="16" y="175" font-size="23">50</text>
    <text x="16" y="248" font-size="16" font-weight="700">正味運転資本</text>
    <text x="16" y="285" font-size="23">400 − 200 = 200</text>
    <text x="16" y="358" font-size="16" font-weight="700">営業正味運転資本</text>
    <text x="16" y="395" font-size="23">150 + 200 − 120 = 230</text>
    <text x="16" y="463" font-size="13">営業指標は現金・金融借入を除く。</text>
    <text x="16" y="494" font-size="13">定義が異なり、同じ金額ではない。</text>
  </g>
</svg>
