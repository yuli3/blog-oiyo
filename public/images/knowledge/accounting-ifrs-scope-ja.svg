<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">K-IFRSの強制適用</title>
  <desc id="desc">韓国施行令第6条の適用経路を要約した図である。金融業種の詳細と法定の例外は直前の本文と公式条文を確認する。親会社の連結・非連結への適用は第2項の別規則であり、外部監査の規模要件とK-IFRSの強制適用は同じではない。</desc>
  <!-- 2026-10-01: Article 6, not a fictional company's audit-size conclusion; details and exceptions remain in the adjacent text. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <rect x="16" y="313" width="288" height="50" rx="12" fill="#e9eddf"/>
  <path d="M160 288V309M154 303L160 309L166 303M16 384H304M160 464V486M154 480L160 486L166 480" fill="none" stroke="#566842" stroke-width="2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">K-IFRSの強制適用</text>
    <text x="16" y="61" font-size="12">韓国施行令第6条の要約</text>
    <text x="16" y="108" font-size="14" font-weight="700">上場または上場予定</text>
    <text x="16" y="140" font-size="12">当期または翌事業年度</text>
    <text x="16" y="169" font-size="12">KONEXへの上場・上場予定は除外</text>
    <text x="16" y="208" font-size="12">または</text>
    <text x="16" y="249" font-size="14" font-weight="700">法令に列挙された金融業種</text>
    <text x="16" y="280" font-size="12">業種と法定の例外は本文を参照</text>
    <text x="16" y="343" font-size="14" font-weight="700">K-IFRSの強制適用</text>
    <text x="16" y="419" font-size="12">親会社がK-IFRSを適用</text>
    <text x="16" y="452" font-size="12">連結財務諸表に適用する場合</text>
    <text x="16" y="511" font-size="12">その親会社の非連結にも適用</text>
  </g>
</svg>
