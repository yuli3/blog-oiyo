<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">한국 주식회사의 규모 요건</title>
  <desc id="desc">자산 A: 150 ≥ 120. 부채 L: 80 ≥ 70. 매출 S: 90 &lt; 100. 종업원 E: 60 &lt; 100. 네 요건 중 두 개 충족. 비상장 주식회사 · 12개월 사업연도. 법정 제외 사유가 없다는 가정</desc>
  <!-- 2026-10-01: Same chapter case; this tests size only, not listing status or statutory exclusions. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="15" font-weight="700">한국 주식회사의 규모 요건</text>
    <text x="16" y="62" font-size="12">금액: 억 원 · 인원: 명</text>
    <text x="16" y="108" font-size="15" font-weight="700">자산 A</text>
    <text x="16" y="138" font-size="20">150 ≥ 120</text>
    <text x="304" y="138" font-size="14" text-anchor="end">충족</text>
    <text x="16" y="186" font-size="15" font-weight="700">부채 L</text>
    <text x="16" y="216" font-size="20">80 ≥ 70</text>
    <text x="304" y="216" font-size="14" text-anchor="end">충족</text>
    <text x="16" y="264" font-size="15" font-weight="700">매출 S</text>
    <text x="16" y="294" font-size="20">90 &lt; 100</text>
    <text x="304" y="294" font-size="14" text-anchor="end">미충족</text>
    <text x="16" y="342" font-size="15" font-weight="700">종업원 E</text>
    <text x="16" y="372" font-size="20">60 &lt; 100</text>
    <text x="304" y="372" font-size="14" text-anchor="end">미충족</text>
    <path d="M16 395H304" stroke="#a7b099"/>
    <text x="16" y="434" font-size="14" font-weight="700">네 요건 중 두 개 충족</text>
    <text x="16" y="486" font-size="13">비상장 주식회사 · 12개월 사업연도</text>
    <text x="16" y="516" font-size="13">법정 제외 사유 없음</text>
  </g>
</svg>
