<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="title desc">
  <title id="title">학습용 자산 1,800만 원은 외감 규모 기준보다 작다</title>
  <desc id="desc">학습용 회사 월말 자산은 1,800만 원입니다. 외감법 시행령의 자산 120억 원 기준은 그보다 자리수가 많습니다. 이 장부에 감사의견을 붙이지 않습니다.</desc>
  <rect width="640" height="400" rx="20" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#263021">
    <text x="32" y="48" font-size="26" font-weight="700">외감 대상이 아닌 학습용 장부</text>
    <text x="32" y="80" font-size="19">확인일 2026-09-01 · 시행령 전 호 아님</text>
    <rect x="24" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="44" y="152" font-size="20">학습용 자산</text>
    <text x="44" y="200" font-size="28" font-weight="700">1,800만 원</text>
    <text x="44" y="236" font-size="18">월말 · 1~5장 회사</text>
    <rect x="332" y="108" width="284" height="160" rx="12" fill="#fff" stroke="#a7b099"/>
    <text x="352" y="152" font-size="20">시행령 예: 자산</text>
    <text x="352" y="200" font-size="28" font-weight="700">120억 원</text>
    <text x="352" y="236" font-size="18">직전 연도 말 · 단독 기준 아님</text>
    <rect x="24" y="288" width="592" height="84" rx="12" fill="#e9eddf"/>
    <text x="44" y="324" font-size="22" font-weight="700">자리수가 다름 · 의견 없음</text>
    <text x="44" y="356" font-size="20">세무조사와 같은 절차가 아님</text>
  </g>
</svg>
