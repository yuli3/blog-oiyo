<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">K-IFRS obligatorias</title>
  <desc id="desc">Resumen del artículo 6 coreano. Los sectores financieros y las excepciones legales se detallan en el párrafo anterior y la norma oficial. Los estados consolidados y no consolidados de la matriz siguen la regla independiente del apartado 2. Los criterios de tamaño para auditoría externa no determinan por sí solos la obligación de aplicar K-IFRS.</desc>
  <!-- 2026-10-01: Article 6, not a fictional company's audit-size conclusion; details and exceptions remain in the adjacent text. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <rect x="16" y="313" width="288" height="50" rx="12" fill="#e9eddf"/>
  <path d="M160 288V309M154 303L160 309L166 303M16 384H304M160 464V486M154 480L160 486L166 480" fill="none" stroke="#566842" stroke-width="2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="17" font-weight="700">K-IFRS obligatorias</text>
    <text x="16" y="61" font-size="12">Reglamento coreano: artículo 6</text>
    <text x="16" y="108" font-size="14" font-weight="700">Cotizada o con cotización prevista</text>
    <text x="16" y="140" font-size="12">Ejercicio actual o siguiente</text>
    <text x="16" y="169" font-size="12">Se excluye cotizar o preverlo en KONEX</text>
    <text x="16" y="208" font-size="12">O</text>
    <text x="16" y="249" font-size="14" font-weight="700">Entidades financieras previstas por ley</text>
    <text x="16" y="280" font-size="12">Sectores y excepciones: véase el texto</text>
    <text x="16" y="343" font-size="14" font-weight="700">K-IFRS obligatorias</text>
    <text x="16" y="419" font-size="12">La matriz aplica K-IFRS</text>
    <text x="16" y="452" font-size="12">en sus estados consolidados</text>
    <text x="16" y="511" font-size="12">También en sus estados no consolidados</text>
  </g>
</svg>
