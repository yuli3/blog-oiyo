<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Un passif, trois ratios de liquidité</title>
  <desc id="desc">Fin 20X2, la liquidité générale de FA vaut 400/200 = 200 %, la liquidité réduite (400 − 200)/200 = 100 % et la liquidité immédiate 50/200 = 25 %. Exclure les stocks réduit le numérateur. Les barres ont la même échelle de ratios. Ces valeurs ne sont ni des seuils sectoriels ni des garanties de capacité de paiement future.</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">Un passif, trois ratios de liquidité</text>
    <text x="16" y="61" font-size="15">Unité : %</text>
    <text x="16" y="90" font-size="15">FA fictive · Fin 20X2</text>
    <text x="16" y="138" font-size="16" font-weight="700">Liquidité générale</text>
    <text x="16" y="172" font-size="21">400 ÷ 200 = 200%</text>
    <rect x="16" y="187" width="288" height="18" fill="#566842"/>
    <text x="16" y="248" font-size="16" font-weight="700">Liquidité réduite</text>
    <text x="16" y="282" font-size="21">(400 − 200) ÷ 200 = 100%</text>
    <rect x="16" y="297" width="144" height="18" fill="#566842"/>
    <text x="16" y="358" font-size="16" font-weight="700">Liquidité immédiate</text>
    <text x="16" y="392" font-size="21">50 ÷ 200 = 25%</text>
    <rect x="16" y="407" width="36" height="18" fill="#566842"/>
    <text x="16" y="463" font-size="13">Dénominateur commun : passif courant final 200</text>
    <text x="16" y="494" font-size="13">Ni seuil sectoriel ni garantie de paiement.</text>
  </g>
</svg>
