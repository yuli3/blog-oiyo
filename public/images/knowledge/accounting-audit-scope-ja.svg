<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 550" width="320" height="550" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">韓国株式会社の規模要件</title>
  <desc id="desc">資産 A: 150 ≥ 120. 負債 L: 80 ≥ 70. 売上高 S: 90 &lt; 100. 従業員 E: 60 &lt; 100. 四つのうち二つに該当. 非上場株式会社 · 12か月の事業年度. 法定の除外事由がないと仮定</desc>
  <!-- 2026-10-01: Same chapter case; this tests size only, not listing status or statutory exclusions. -->
  <rect width="320" height="550" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="15" font-weight="700">韓国株式会社の規模要件</text>
    <text x="16" y="62" font-size="12">金額：億ウォン · 人数：人</text>
    <text x="16" y="108" font-size="15" font-weight="700">資産 A</text>
    <text x="16" y="138" font-size="20">150 ≥ 120</text>
    <text x="304" y="138" font-size="14" text-anchor="end">該当</text>
    <text x="16" y="186" font-size="15" font-weight="700">負債 L</text>
    <text x="16" y="216" font-size="20">80 ≥ 70</text>
    <text x="304" y="216" font-size="14" text-anchor="end">該当</text>
    <text x="16" y="264" font-size="15" font-weight="700">売上高 S</text>
    <text x="16" y="294" font-size="20">90 &lt; 100</text>
    <text x="304" y="294" font-size="14" text-anchor="end">非該当</text>
    <text x="16" y="342" font-size="15" font-weight="700">従業員 E</text>
    <text x="16" y="372" font-size="20">60 &lt; 100</text>
    <text x="304" y="372" font-size="14" text-anchor="end">非該当</text>
    <path d="M16 395H304" stroke="#a7b099"/>
    <text x="16" y="434" font-size="14" font-weight="700">四つのうち二つに該当</text>
    <text x="16" y="486" font-size="13">非上場株式会社 · 12か月の事業年度</text>
    <text x="16" y="516" font-size="13">法定の除外事由なし</text>
  </g>
</svg>
