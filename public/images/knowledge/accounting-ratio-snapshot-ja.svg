<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">同じ負債、異なる流動性比率</title>
  <desc id="desc">FA社の20X2年末の流動比率は400/200 = 200%、当座比率は(400 − 200)/200 = 100%、現金比率は50/200 = 25%。棚卸資産を除くほど分子は小さくなる。棒は同じ比率尺度を使い、業種の合格基準や将来の支払能力を保証する数値ではない。</desc>
  <!-- 2026-10-01: FA chapter 1 closing balances; no invented observation date, maturity or industry benchmark. -->
  <rect width="320" height="520" rx="12" fill="#f7f7f2"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans, sans-serif" fill="#263021">
    <text x="16" y="32" font-size="16" font-weight="700">同じ負債、異なる流動性比率</text>
    <text x="16" y="61" font-size="15">単位：%</text>
    <text x="16" y="90" font-size="15">架空のFA社・20X2年末</text>
    <text x="16" y="138" font-size="16" font-weight="700">流動比率</text>
    <text x="16" y="172" font-size="21">400 ÷ 200 = 200%</text>
    <rect x="16" y="187" width="288" height="18" fill="#566842"/>
    <text x="16" y="248" font-size="16" font-weight="700">当座比率</text>
    <text x="16" y="282" font-size="21">(400 − 200) ÷ 200 = 100%</text>
    <rect x="16" y="297" width="144" height="18" fill="#566842"/>
    <text x="16" y="358" font-size="16" font-weight="700">現金比率</text>
    <text x="16" y="392" font-size="21">50 ÷ 200 = 25%</text>
    <rect x="16" y="407" width="36" height="18" fill="#566842"/>
    <text x="16" y="463" font-size="13">分母はすべて期末流動負債200</text>
    <text x="16" y="494" font-size="13">業種の合格基準や支払保証ではない。</text>
  </g>
</svg>
